<style>

:root{
  --bg:#101318; --surf:#191D23; --surf2:#212630; --line:#2B313A;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);margin:0;padding:0;}
body{font-family:var(--f-body);color:var(--text);-webkit-font-smoothing:antialiased;}
#app{background:var(--bg);min-height:100vh;min-height:100dvh;
     padding-bottom:calc(104px + (env(safe-area-inset-bottom) * 0.3));overflow-x:hidden;}
h1,h2,h3,.disp{font-family:var(--f-disp);font-weight:600;letter-spacing:0;}
.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;display:inline-block;}
button{font-family:inherit;}

/* ---------- الهيدر ---------- */
header{padding:calc(34px + env(safe-area-inset-top)) 18px 0;
       display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.lbl{font-size:12px;color:var(--muted);font-weight:500;}
.hero{font-family:var(--f-disp);font-size:42px;font-weight:700;line-height:1.05;margin-top:6px;}
.hero em{font-style:normal;font-size:14px;color:var(--muted);font-family:var(--f-body);
         font-weight:400;margin-inline-start:8px;}
.gear{background:var(--surf);border:1px solid var(--line);color:var(--muted);border-radius:12px;
      width:40px;height:40px;flex:none;cursor:pointer;display:grid;place-items:center;}

/* ---------- شريط توزيع الفلوس ---------- */
.split{display:flex;gap:3px;height:10px;margin:18px 18px 0;border-radius:99px;overflow:hidden;
       background:var(--surf2);}
.split div{height:100%;}
.wrap{padding:0 18px;}

/* ---------- عناصر عامة ---------- */
.sec{margin-top:28px;}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.sec-h h3{margin:0;font-size:16px;}
.sec-h span{font-size:12px;color:var(--muted);}

.panel{background:var(--surf);border:1px solid var(--line);border-radius:20px;overflow:hidden;}
.arow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);}
.arow:last-child{border-bottom:0;}
.rail{width:4px;height:26px;border-radius:99px;flex:none;}
.arow .nm{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.arow .vl{font-family:var(--f-num);font-size:15px;font-weight:600;direction:ltr;}

.stats{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:20px;}
.stat{flex:1;padding:16px 10px;text-align:center;border-inline-end:1px solid var(--line);}
.stat:last-child{border-inline-end:0;}
.stat b{display:block;font-family:var(--f-num);font-size:19px;font-weight:600;direction:ltr;margin-bottom:4px;}
.stat span{font-size:11.5px;color:var(--muted);}

.mpills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
.mpills::-webkit-scrollbar{display:none;}
.mpill{flex:none;background:var(--surf);border:1px solid var(--line);color:var(--muted);
  border-radius:99px;padding:8px 14px;font-size:12.5px;font-family:var(--f-num);cursor:pointer;}
.mpill.on{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:600;}

.cat{margin-bottom:14px;}
.cat-t{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:7px;gap:10px;}
.cat-t .r{display:flex;gap:8px;align-items:baseline;flex:none;}
.cat-t .pc{font-size:11px;color:var(--muted);font-family:var(--f-num);}
.cat-t .am{font-family:var(--f-num);font-size:13.5px;font-weight:600;direction:ltr;}
.track{height:6px;background:var(--surf2);border-radius:99px;overflow:hidden;}
.fill{height:100%;border-radius:99px;transition:width .45s cubic-bezier(.2,.7,.3,1);}

.tx{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surf);
    border:1px solid var(--line);border-radius:16px;margin-bottom:9px;cursor:pointer;}
.tx .ic{width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;
        font-size:15px;font-family:var(--f-disp);font-weight:600;}
.tx .g{flex:1;min-width:0;}
.tx .t{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx .s{font-size:11px;color:var(--muted);margin-top:3px;}
.tx .a{font-family:var(--f-num);font-size:14.5px;font-weight:600;white-space:nowrap;direction:ltr;}
.detail{margin:-3px 0 12px;padding:2px 14px 0;}
.detail .d{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:6px 0;
  color:#BFC7D1;border-bottom:1px dashed var(--line);}
.detail .d:last-of-type{border-bottom:0;}

/* ---------- فورم ---------- */
label.f{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 7px;font-weight:500;}
label.f b{color:var(--accent);}
input.f,select.f{width:100%;max-width:100%;min-width:0;background:var(--surf);border:1px solid var(--line);
  border-radius:14px;padding:11px 13px;color:var(--text);font:inherit;font-size:15px;
  -webkit-appearance:none;appearance:none;}
input.f:focus{outline:2px solid var(--accent);outline-offset:1px;}
input[type=date].f,input[type=time].f{direction:ltr;text-align:center;font-family:var(--f-num);
  font-size:15px;display:flex;align-items:center;justify-content:center;
  height:44px;line-height:1;width:100%;padding:0 12px;}
input[type=date].f::-webkit-date-and-time-value,
input[type=time].f::-webkit-date-and-time-value{text-align:center;margin:0;width:100%;line-height:1;}
input[type=date].f::-webkit-datetime-edit,
input[type=time].f::-webkit-datetime-edit{padding:0;line-height:1;}
.money{position:relative;margin-top:6px;}
.money input{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:20px;
  padding:26px 60px 26px 20px;color:var(--text);font-family:var(--f-num);font-size:36px;
  font-weight:600;text-align:center;direction:ltr;-webkit-appearance:none;appearance:none;}
.money input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.money span{position:absolute;inset-inline-end:22px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:13px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{border:1px solid var(--line);background:var(--surf);color:#D2D8E0;border-radius:12px;
  padding:8px 12px;font:inherit;font-size:12.5px;cursor:pointer;transition:.15s;}
.chip.on{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600;}
.chip.sm{padding:7px 12px;font-size:12px;border-radius:11px;}
.frow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:12px;}
.frow .btn{width:auto;margin-top:0;padding:12px 20px;font-size:14px;border-radius:14px;}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.grid4 .chip{width:100%;text-align:center;padding-left:4px;padding-right:4px;}
.drow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.drow input.f{flex:1 1 130px;width:auto;min-width:120px;}
.seg{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:5px;gap:5px;}
.seg button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;
  padding:11px 4px;border-radius:12px;cursor:pointer;}
.seg button.on{background:var(--accent);color:var(--on);font-weight:600;}
.btn{width:100%;border:0;border-radius:16px;padding:14px;font:inherit;font-size:15px;font-weight:600;
  cursor:pointer;background:var(--accent);color:var(--on);margin-top:18px;}
.btn.ghost{background:transparent;border:1px solid var(--line);color:#D2D8E0;margin-top:12px;font-weight:500;}
.btn.danger{background:transparent;border:1px solid #4A2E2B;color:#FF9C90;margin-top:12px;font-weight:500;}
.btn:disabled{opacity:.4;}
.hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.7;}

/* ---------- الفاتورة الورقية ---------- */
.receipt{background:var(--paper);color:var(--paper-ink);border-radius:8px 8px 0 0;
  padding:20px 16px 14px;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.45);}
.receipt::after{content:"";position:absolute;inset-inline:0;bottom:-10px;height:10px;
  background-image:linear-gradient(45deg,transparent 50%,var(--bg) 50%),
                   linear-gradient(-45deg,transparent 50%,var(--bg) 50%);
  background-size:16px 10px;background-repeat:repeat-x;}
.rh{text-align:center;border-bottom:1px dashed #B9B3A6;padding-bottom:12px;margin-bottom:6px;}
.rh b{font-family:var(--f-disp);font-size:16px;font-weight:600;}
.rh div{font-size:11px;color:#6E6759;margin-top:4px;font-family:var(--f-num);direction:ltr;}
.rl{display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px dotted #CDC7B8;}
.rl input,.rl select{background:transparent;border:0;font-family:var(--f-body);color:var(--paper-ink);padding:2px;min-width:0;}
.rl input.nm{flex:1;font-size:13.5px;}
.rl input.vl{width:74px;text-align:end;font-family:var(--f-num);font-weight:600;font-size:13.5px;direction:ltr;}
.rl select{font-size:10.5px;color:#6E6759;max-width:94px;}
.rl .x{background:none;border:0;color:#A9391F;font-size:17px;cursor:pointer;padding:0 3px;line-height:1;}
.rt{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;margin-top:6px;
  border-top:1px dashed #B9B3A6;font-weight:600;font-size:16px;font-family:var(--f-disp);}
.rt span:last-child{font-family:var(--f-num);direction:ltr;}

.drop{border:1.5px dashed var(--line);border-radius:22px;padding:44px 20px;text-align:center;
  background:var(--surf);cursor:pointer;}
.drop p{margin:14px 0 6px;font-size:15px;font-family:var(--f-disp);font-weight:600;}
.drop small{color:var(--muted);font-size:12px;line-height:1.7;display:block;}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:36px 12px;line-height:1.9;}
.note{padding:13px 15px;border-radius:14px;font-size:12.5px;line-height:1.75;margin-top:16px;}
.note.err{background:#2A1D1C;border:1px solid #4A2E2B;color:#FFC0B7;}
.note.warn{background:#26241A;border:1px solid #4A452C;color:#EDD9A6;}
.note.ok{background:#152A22;border:1px solid #2F5A47;color:#A9E3CD;}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);
  border-radius:99px;animation:sp .8s linear infinite;margin:0 auto;}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}.fill{transition:none}}
.steps{font-size:13px;color:#C6CDD6;line-height:2;padding-inline-start:18px;margin:10px 0 0;}

/* ---------- النافبار ---------- */
nav{position:fixed;bottom:calc(14px + (env(safe-area-inset-bottom) * 0.3));inset-inline:15px;
  background:rgba(25,29,35,.94);backdrop-filter:blur(16px);border:1px solid var(--line);
  border-radius:24px;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px;
  box-shadow:0 14px 36px rgba(0,0,0,.55);z-index:40;}
nav button{background:none;border:0;color:var(--muted);font-size:10.5px;display:flex;
  flex-direction:column;align-items:center;gap:5px;cursor:pointer;padding:4px 2px;}
nav button.on{color:var(--accent);}
nav .ni{width:44px;height:30px;border-radius:12px;display:grid;place-items:center;transition:background .18s;}
nav button.on .ni{background:var(--accent);}
nav button.on .ni svg{stroke:var(--on);}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}

.rep .catline{font-size:11.5px;color:var(--muted);font-weight:600;margin:16px 0 8px;
  padding-bottom:6px;border-bottom:1px solid var(--line);}
.rep .catline:first-child{margin-top:4px;}
.rep .l.catsum{font-weight:600;color:#D6DCE4;border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;}

.rl .who{background:#E7E2D6;border:1px solid #CDC7B8;color:#5C5648;border-radius:9px;
  font:inherit;font-size:10.5px;font-weight:600;padding:5px 9px;cursor:pointer;white-space:nowrap;}
.rl .who.on{background:#2E7D5B;border-color:#2E7D5B;color:#fff;}
.rl .who.on.off{background:#8C7BF0;border-color:#8C7BF0;}
.rl .x{margin-inline-start:8px;}

.alert{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);}
.alert:last-child{border-bottom:0;}
.alert .g{flex:1;min-width:0;}
.alert .t{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.alert .s{font-size:11px;color:var(--muted);margin-top:6px;}
.inline{padding:0 16px 16px;border-bottom:1px solid var(--line);}
.tag{font-size:10.5px;padding:3px 8px;border-radius:8px;background:var(--surf2);color:var(--muted);}
.catchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surf);
  border-radius:12px;padding:8px 11px;font-size:12.5px;margin:0 0 8px 8px;}
.catchip b{width:8px;height:8px;border-radius:99px;display:inline-block;}
.catchip button{background:none;border:0;color:var(--clay);font-size:15px;line-height:1;cursor:pointer;padding:0 2px;}
.bookseg{display:flex;gap:4px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:4px;margin:0 18px 4px;}
.bookseg button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:12.5px;padding:9px 4px;border-radius:11px;cursor:pointer;}
.bookseg button.on{background:var(--accent);color:var(--on);font-weight:600;}
.rep{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:16px;}
.rep h4{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:500;}
.rep .l{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line);}
.rep .l:last-child{border-bottom:0;}
.rep .l small{color:var(--muted);font-size:11px;}
.rep .tot{display:flex;justify-content:space-between;font-weight:600;font-size:14px;padding-top:10px;margin-top:6px;border-top:1px solid var(--line);}
body.office{--accent:#6FD3B5;--on:#0B241D;}
body.office .bookseg{border-color:#2E5147;}
#printarea{display:none;}
#toast{position:fixed;inset-inline:0;bottom:calc(90px + (env(safe-area-inset-bottom) * 0.3));z-index:60;
  display:flex;justify-content:center;pointer-events:none;opacity:0;transition:opacity .2s;}
#toast.on{opacity:1;}
#toast span{background:var(--accent);color:var(--on);font-size:13px;font-weight:600;
  padding:10px 18px;border-radius:99px;box-shadow:0 10px 26px rgba(0,0,0,.5);}
@media print{
  #app,nav{display:none!important;}
  html,body{background:#fff!important;}
  #printarea{display:block!important;background:#fff;color:#111;padding:0 6mm;font-family:'IBM Plex Sans Arabic',sans-serif;}
  #printarea h1{font-size:19px;margin:0 0 2px;}
  #printarea .sub{font-size:11px;color:#555;margin-bottom:14px;}
  #printarea h2{font-size:14px;margin:16px 0 6px;border-bottom:1px solid #000;padding-bottom:4px;}
  #printarea .l{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:5px 0;border-bottom:1px dotted #bbb;}
  #printarea .catline{font-size:12px;font-weight:700;margin:12px 0 4px;border-bottom:1px solid #999;padding-bottom:3px;}
  #printarea .l.catsum{font-weight:700;border-bottom:0;border-top:1px dashed #999;margin-top:3px;}
  #printarea .l small{color:#666;font-size:10px;}
  #printarea .tot{display:flex;justify-content:space-between;font-weight:700;font-size:13px;padding-top:7px;margin-top:4px;border-top:1.5px solid #000;}
  #printarea .final{margin-top:18px;padding:10px;border:1.5px solid #000;font-size:14px;font-weight:700;display:flex;justify-content:space-between;}
  #printarea .foot{margin-top:20px;font-size:10px;color:#666;}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="lbl">إجمالي اللي معاك</div>
      <div class="hero"><span class="n" id="total">0</span><em>جنيه</em></div>
      <div class="lbl" id="creditnote" style="margin-top:10px;line-height:1.7;max-width:250px"></div>
    </div>
    <button class="gear" onclick="app.go('settings')" aria-label="الإعدادات">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <div class="bookseg" id="bookseg">
    <button class="${'me'}" id="bk-me" onclick="app.setBook('me')">فلوسي</button>
    <button id="bk-office" onclick="app.setBook('office')">المكتب</button>
  </div>
  <div class="split" id="split"></div>
  <div class="wrap" id="view"></div>
</div>

<nav>
  <button data-tab="home" onclick="app.go('home')"><span class="ni">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.8 20v-5.5h4.4V20"/></svg></span>الرئيسية</button>
  <button data-tab="scan" onclick="app.go('scan')"><span class="ni">
    <svg viewBox="0 0 24 24"><path d="M6 3.5h12v15.8l-2 -1.3-2 1.3-2-1.3-2 1.3-2-1.3-2 1.3z"/><path d="M9 8h6M9 11.5h6"/></svg></span>فاتورة</button>
  <button data-tab="add" onclick="app.go('add')"><span class="ni">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 8.2v7.6M8.2 12h7.6"/></svg></span>إضافة</button>
  <button data-tab="wallet" onclick="app.go('wallet')"><span class="ni">
    <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="13" rx="3"/><path d="M2.5 10.5h19"/><path d="M6 15h3.5"/></svg></span>المحفظة</button>
  <button data-tab="log" onclick="app.go('log')"><span class="ni">
    <svg viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg></span>السجل</button>
</nav>

<div id="printarea"></div>
<div id="toast"><span></span></div>
<input type="file" id="picker2" accept="image/*" style="display:none" onchange="app.pickFile(this)">

<script>
/* ==========================================================================
   مصاريفي — فهرس الملف
   ==========================================================================
   1) ثوابت ............. التصنيفات والألوان والشهور
   2) أدوات عامة ........ التواريخ والأرقام والتنسيق
   3) الحالة والتخزين ... التحميل والحفظ والترحيل (normalizeData)
   4) مشتقات ............ الأرصدة والتقارير والحسابات المشتقة:
        · balances / officeReport        الأرصدة وتقرير التقفيل
        · stmtKey..buildStmt             دورة كارت الائتمان والمديونية
        · insWhen..certNext              الأقساط والشهادات
        · catchUp / autoTrials           التقييد التلقائي
        · ghApi..ghConnect               المزامنة مع GitHub
   5) قراءة الفاتورة .... promptText / readReceipt / readSms
   6) قطع واجهة مشتركة .. payChips / dateField / acctRow
   7) الشاشات ...........
        · vWelcome                       شاشة الترحيب لأول مرة
        · vHome / alertsPanel            الرئيسية ومحتاج انتباهك
        · vAdd / vAddOffice              إضافة حركة (فلوسك / المكتب)
        · vScan                          الفاتورة: تصوير ولصق ويدوي
        · vWallet                        المحفظة وتبويباتها:
            wAccounts  wVouchers  wSubs  wIns  wVeh  wCerts  wClose
        · vLog                           السجل
        · vSettings                      الإعدادات
   8) المحرك ............ render والتشغيل
   ==========================================================================

   ملاحظات للتعديل:
   - alertsPanel أكبر دالة في الملف، وفيها كل التنبيهات بالترتيب:
     التجارب ← الأقساط ← السحب المتكرر ← تدبير العملة ← الأوراق ←

function stampQ(){
  if(!D._qmax)D._qmax=0;
  for(let i=D.txns.length-1;i>=0;i--){
    if(D.txns[i]._q===undefined)D.txns[i]._q=++D._qmax;
    else if(D.txns[i]._q>D._qmax)D._qmax=D.txns[i]._q;
  }
}
function sortTxns(){
  stampQ();
  return D.txns.sort((a,b)=>{
    if(a.date!==b.date)return a.date<b.date?1:-1;
    return (b._q||0)-(a._q||0);
  });
}

/* ==========================================================================
   وعاء الادخار (atype:'save')
   - بيظهر في التحويلات بس: مش في أي مكان تصرف منه أو تستلم عليه.
   - برّه «إجمالي اللي معاك» خالص.
   - العايد نوع حركة لوحده (kind:'yield'): بيزود رصيد الوعاء، ومش دخل.
   - saveRates: [{from,rate}] — النسبة السنوية وتاريخ سريانها. كل يوم بنسبته.
   - saveFreq:
       day   → تراكمي يومي، بيتقيّد سطر واحد آخر كل شهر خلص (saveBooked = آخر شهر).
               الشهر الشغال بيبان في رصيد الوعاء من غير قيد (saveAccrued).
       month → يوم saveDay من كل شهر: الرصيد × متوسط النسبة ÷ ١٢.
       year  → يوم saveYearDay (MM-DD) كل سنة: الرصيد × متوسط النسبة.
       saveLast = آخر يوم دفع (شهري/سنوي).
   - العمولة بتتكتب وقت التحويل، وبتتخصم من الوعاء.
   ========================================================================== */
const isSave=a=>!!a&&a.atype==='save';
const saveAcc=id=>{const a=(D.accounts||[]).find(x=>x.id===id);return isSave(a)?a:null;};
const pad2=n=>String(n).padStart(2,'0');
const isoAdd=(d,n)=>{const p=String(d).split('-').map(Number);const x=new Date(p[0],p[1]-1,p[2]+n);
  return x.getFullYear()+'-'+pad2(x.getMonth()+1)+'-'+pad2(x.getDate());};
const monthEnd=ym=>{const p=ym.split('-').map(Number);return ym+'-'+pad2(new Date(p[0],p[1],0).getDate());};
const nextMonth=ym=>{const p=ym.split('-').map(Number);return p[1]===12?(p[0]+1)+'-01':p[0]+'-'+pad2(p[1]+1);};
const yearDate=(y,md)=>{const p=String(md||'01-01').split('-').map(Number);
  const last=new Date(y,p[0],0).getDate();return y+'-'+pad2(p[0])+'-'+pad2(Math.min(p[1],last));};
function saveRateOn(a,d){
  const h=(a.saveRates||[]).filter(x=>x.from<=d);
  return h.length?Number(h[h.length-1].rate)||0:(Number(a.saveRate)||0);
}
function saveAvgRate(a,from,to){
  let sum=0,n=0,d=from,g=0;
  while(d<=to&&g++<400){sum+=saveRateOn(a,d);n++;d=isoAdd(d,1);}
  return n?sum/n:saveRateOn(a,to);
}
function saveFlows(a){
  const m={};
  D.txns.forEach(t=>{
    if((t.book||'me')!=='me')return;
    const v=Number(t.amount)||0;let f=0;
    if(t.kind==='transfer'){if(t.account===a.id)f-=v;if(t.to===a.id)f+=v;}
    else if(t.account===a.id){
      if(t.kind==='income'||t.kind==='float'||t.kind==='yield')f=v;
      else if(t.kind==='expense')f=-v;
      else if(t.kind==='settle')f=t.dir==='in'?v:-v;}
    if(f)m[t.date]=(m[t.date]||0)+f;
  });
  return m;
}
function saveBalBefore(a,flows,d){let x=Number(a.opening)||0;Object.keys(flows).forEach(k=>{if(k<d)x+=flows[k];});return x;}
function saveMonthAcc(a,flows,from,to){
  let bal=saveBalBefore(a,flows,from),acc=0,d=from,g=0;
  while(d<=to&&g++<400){
    bal+=flows[d]||0;
    const r=saveRateOn(a,d)/100/365;
    if(bal+acc>0)acc+=(bal+acc)*r;
    d=isoAdd(d,1);
  }
  return acc;
}
function saveAccrued(a){
  if(!isSave(a)||(a.saveFreq&&a.saveFreq!=='day')||!a.saveStart)return 0;
  const td=today(),y=isoAdd(td,-1),cur=monthOf(td);
  const from=(a.saveStart>cur+'-01')?a.saveStart:cur+'-01';
  if(from>y)return 0;
  return Math.round(saveMonthAcc(a,saveFlows(a),from,y)*100)/100;
}
function saveEarned(a){
  const booked=D.txns.filter(t=>t.kind==='yield'&&t.account===a.id).reduce((x,t)=>x+(Number(t.amount)||0),0);
  return Math.round((booked+saveAccrued(a))*100)/100;
}
/* ديون الكارت في التاريخ ده من الدفترين — الكارت واحد عند البنك */
function cardDebtAt(id,d){
  let x=0;
  D.txns.forEach(t=>{
    if(t.date>d)return;
    const v=Number(t.amount)||0;
    if(t.kind==='transfer'){if(t.account===id)x+=v;if(t.to===id)x-=v;return;}
    if(t.account!==id)return;
    if(t.kind==='expense')x+=v;
    else if(t.kind==='income'||t.kind==='float'||t.kind==='yield')x-=v;
    else if(t.kind==='settle')x+=(t.dir==='in'?-v:v);
  });
  return Math.round(x*100)/100;
}
/* --------------------------------------------------------------------------
   أقساط الكارت (mode:'bank') — زي البنك بالظبط:
   - يوم الشراء: الأصل كله بيتسجل مصروف على الكارت.
   - كل كشف: الفايدة = الأصل الفاضل × النسبة الشهرية، مقطوعة لقرشين،
     بتتسجل على الكارت وبتستنى تأكيدك.
   - القسط نفسه بيتسدد مع كشف الكارت، مش لوحده.
   - أقساط السلفة ما بتتأثرش بأي حاجة هنا.
   -------------------------------------------------------------------------- */
function insPmt(P,n,r){
  if(!(P>0)||!(n>0))return 0;
  if(!(r>0))return Math.round(P/n*100)/100;
  return Math.round(P*r/(1-Math.pow(1+r,-n))*100)/100;
}
function insRateFrom(P,n,pmt){
  if(!(P>0)||!(n>0)||!(pmt>0))return null;
  if(pmt*n<=P+0.005)return 0;
  let lo=0,hi=1;
  for(let g=0;g<200;g++){const m=(lo+hi)/2;const v=P*m/(1-Math.pow(1+m,-n));if(v>pmt)hi=m;else lo=m;}
  return (lo+hi)/2;
}
function insSchedule(i){
  const a=(D.accounts||[]).find(x=>x.id===i.src);if(!a)return [];
  const n=Number(i.months)||0,r=Number(i.rate)||0,pmt=Number(i.monthly)||0,out=[];
  let rem=Number(i.principal)||0;
  for(let k=1;k<=n;k++){
    const key=mAdd(i.firstKey,k-1);
    const it=Math.floor(rem*r*100+1e-6)/100;
    const prin=k===n?rem:Math.round((pmt-it)*100)/100;
    out.push({k:k,key:key,date:dayShift(stmtDate(key,a),-1),int:it,prin:prin});
    rem=Math.round((rem-prin)*100)/100;
  }
  return out;
}
function insBankLeft(i){
  const sc=insSchedule(i),p=Number(i.paid)||0;
  return Math.round(sc.slice(p).reduce((x,e)=>x+e.prin,0)*100)/100;
}

/* تأمين الكارت: يوم ١ من كل شهر، نسبة من رصيد الكارت يوم آخر كشف، والكسور بتتقطع */
function insuranceAll(){
  let changed=false;const td=today(),cur=monthOf(td);
  (D.accounts||[]).filter(a=>a.credit&&acctRate(a)>0).forEach(a=>{
    if(!a.insLast){a.insLast=cur;changed=true;return;}
    let m=nextMonth(a.insLast),g=0;
    while(m<=cur&&g++<120){
      const prev=(function(){const p=m.split('-').map(Number);
        return p[1]===1?(p[0]-1)+'-12':p[0]+'-'+pad2(p[1]-1);})();
      const sd=prev+'-'+pad2(Math.min(clampDay(Number(a.stmtDay)||20),Number(monthEnd(prev).slice(8))));
      const debt=cardDebtAt(a.id,sd);
      const fee=Math.floor(Math.max(0,debt)*acctRate(a))/100;
      if(fee>=0.01)D.txns.unshift({id:uid(),book:'me',kind:'expense',amount:fee,cat:'fees',
        account:a.id,date:m+'-01',insFee:true,pending:true,note:'تأمين '+a.name+' — '+mLabel(m)});
      a.insLast=m;changed=true;m=nextMonth(m);
    }
  });
  if(changed){sortTxns();save();}
}
function saveAccrueAll(){
  let changed=false;const td=today();
  (D.accounts||[]).filter(isSave).forEach(a=>{
    if(!a.saveStart)return;
    const push=(amt,date,lbl)=>{if(amt>=0.01)D.txns.unshift({id:uid(),book:'me',kind:'yield',amount:amt,
      account:a.id,date:date,saveInt:true,note:'عايد '+a.name+' — '+lbl});};
    if(a.saveFreq==='month'||a.saveFreq==='year'){
      const pays=[];
      if(a.saveFreq==='month'){
        const day=clampDay(Number(a.saveDay)||1);
        let ym=monthOf(a.saveStart),g=0;
        while(g++<600){const pd=ym+'-'+pad2(Math.min(day,Number(monthEnd(ym).slice(8))));
          if(pd>td)break;if(pd>a.saveStart)pays.push({pd:pd,lbl:mLabel(ym)});ym=nextMonth(ym);}
      }else{
        let y=Number(a.saveStart.slice(0,4)),g=0;
        while(g++<100){const pd=yearDate(y,a.saveYearDay||a.saveStart.slice(5));
          if(pd>td)break;if(pd>a.saveStart)pays.push({pd:pd,lbl:'سنة '+y});y++;}
      }
      let prev=a.saveStart;
      pays.forEach(p=>{
        if(!a.saveLast||p.pd>a.saveLast){
          const bal=saveBalBefore(a,saveFlows(a),p.pd);
          const avg=saveAvgRate(a,prev,isoAdd(p.pd,-1));
          const amt=Math.round(bal*avg/(a.saveFreq==='month'?12:1))/100;
          push(amt,p.pd,p.lbl);a.saveLast=p.pd;changed=true;
        }
        prev=p.pd;
      });
    }else{
      const cur=monthOf(td);
      let ym=a.saveBooked?nextMonth(a.saveBooked):monthOf(a.saveStart),g=0;
      while(ym<cur&&g++<600){
        const from=(a.saveStart>ym+'-01')?a.saveStart:ym+'-01';
        push(Math.round(saveMonthAcc(a,saveFlows(a),from,monthEnd(ym))*100)/100,monthEnd(ym),mLabel(ym));
        a.saveBooked=ym;changed=true;ym=nextMonth(ym);
      }
    }
  });
  if(changed){sortTxns();save();}
}

function saveDraftOf(a){
  const r=saveRateOn(a,today());
  return {id:a.id,saveRate:r?String(r):'',saveFreq:a.saveFreq||'day',_freq0:a.saveFreq||'day',_rate0:r,
    saveDay:String(a.saveDay||1),saveYearDate:today().slice(0,5)+(a.saveYearDay||today().slice(5)),
    saveStart:a.saveStart||today(),saveWithdraw:a.saveWithdraw||'',rateFrom:today()};
}
function applySaveCfg(a,o){
  const isNew=!a.saveStart, td=today();
  const newFreq=o.saveFreq==='month'?'month':o.saveFreq==='year'?'year':'day';
  const newRate=Number(onlyNum(o.saveRate))||0;
  if(isNew){
    a.saveStart=o.saveStart||td;
    a.saveRates=[{from:a.saveStart,rate:newRate}];
  }else if(newFreq!==(a.saveFreq||'day')){
    /* طريقة جديدة = فترة جديدة من النهارده. اليومي بيقيّد اللي اتجمع لحد إمبارح الأول */
    if((a.saveFreq||'day')==='day'){
      saveAccrueAll();
      const acc=saveAccrued(a);
      if(acc>=0.01)D.txns.unshift({id:uid(),book:'me',kind:'yield',amount:acc,account:a.id,
        date:isoAdd(td,-1),saveInt:true,note:'عايد '+a.name+' — لحد تغيير الطريقة'});
    }
    a.saveStart=td;delete a.saveBooked;delete a.saveLast;
    a.saveRates=[{from:td,rate:newRate}];
  }else if(newRate!==saveRateOn(a,td)||(o.rateFrom&&newRate!==saveRateOn(a,o.rateFrom))){
    let from=o.rateFrom||td;
    /* الفترات اللي اتقيّدت خلاص ما بتتحسبش تاني */
    const lock=a.saveBooked?isoAdd(monthEnd(a.saveBooked),1):(a.saveLast?isoAdd(a.saveLast,1):a.saveStart);
    if(from<lock)from=lock;
    a.saveRates=(a.saveRates||[{from:a.saveStart,rate:Number(a.saveRate)||0}]).filter(x=>x.from<from);
    a.saveRates.push({from:from,rate:newRate});
  }
  a.saveRate=newRate;

function txnTitle(t){

const dayShift=(ds,n)=>{const p=ds.split('-').map(Number);
  const d=new Date(p[0],p[1]-1,p[2]+n);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const normItem=s=>String(s||'').trim().replace(/\s+/g,' ');

function groupOwning(name,exceptId){

  const n=normItem(item||'');

function officeReport(from,to){
  const off=D.txns.filter(t=>t.book==='office');
  const sign=t=>{const v=Number(t.amount)||0;
    return t.kind==='expense'?-v:(t.kind==='income'||t.kind==='float')?v:t.kind==='settle'?(t.dir==='in'?v:-v):0;};
  const base=D.accounts.reduce((x,a)=>x+(Number(a.openingOffice)||0),0);
  const opening=base+off.filter(t=>t.date<from).reduce((a,t)=>a+sign(t),0);
  const floats=off.filter(t=>t.kind==='float'&&t.date>=from&&t.date<=to)
                  .sort((a,b)=>a.date<b.date?-1:1);
  const exp=off.filter(t=>t.kind==='expense'&&t.date>=from&&t.date<=to);
  const g={};
  exp.forEach(t=>{
    const raw=normItem(t.item||t.note||t.merchant||'بند');
    const gn=groupNameFor(raw);
    const key=(t.ocat||'')+'|'+(gn||raw);
    if(!g[key])g[key]={item:gn||raw,ocat:t.ocat||'',n:0,sum:0,grouped:!!gn,parts:{}};
    g[key].n++;g[key].sum+=Number(t.amount)||0;
    if(gn)g[key].parts[raw]=Math.round(((g[key].parts[raw]||0)+(Number(t.amount)||0))*100)/100;});
  const items=Object.values(g).sort((a,b)=>b.sum-a.sum);
  const byCat={};
  items.forEach(i=>byCat[i.ocat]=(byCat[i.ocat]||0)+i.sum);
  const floatsTotal=floats.reduce((a,t)=>a+Number(t.amount),0);
  const spent=items.reduce((a,i)=>a+i.sum,0);
  const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
  return {from:from,to:to,opening:r2(opening),floats:floats,floatsTotal:r2(floatsTotal),
          items:items.map(i=>({item:i.item,ocat:i.ocat,n:i.n,sum:r2(i.sum),grouped:i.grouped,parts:i.parts})),
          byCat:Object.keys(byCat).reduce((o,k)=>{o[k]=r2(byCat[k]);return o;},{}),
          spent:r2(spent),result:r2(opening+floatsTotal-spent)};
}

const insLeft=i=>{

const insFirst=i=>i.firstMonth||monthOf(today());
const insTail=i=>Number(i.tail)||0;
const insNextMonth=i=>i.covered?mAdd(i.covered,1):insFirst(i);
const insNextAmount=i=>((Number(i.paid)||0)>=(Number(i.months)||0)&&insRest(i)>0)
  ?insRest(i):(Number(i.monthly)||0);
const insLastOpenMonth=i=>mAdd(insFirst(i),Math.max(0,(Number(i.months)||0)-1-insTail(i)));
function insAhead(i){
  if(!i.covered)return 0;

function stmtKey(d,a){

function stmtDue(key,a){const m=mAdd(key,1);return m+'-'+dayInMonth(m,acctGraceDay(a));}
function insDueThisStmt(accId){

    .reduce((a,i)=>a+insNextAmount(i),0)*100)/100;

    .reduce((a,i)=>a+insLeft(i),0);

const stmtRecord=(accId,key)=>(D.stmts||[]).find(s=>s.acct===accId&&s.key===key);
function stmtRange(a,key){
  // الدورة: من يوم الكشف بتاع الشهر اللي فات لحد اليوم اللي قبله في الشهر ده
  const pm=mAdd(key,-1), d=acctStmtDay(a);
  return {from:pm+'-'+dayInMonth(pm,d), to:dayShift(key+'-'+dayInMonth(key,d),-1)};
}
function buildStmt(a,key){
  const r=stmtRange(a,key);
  // اللي اتصرف على الكارت جوه الدورة بس
  let spent=0;
  D.txns.forEach(t=>{
    if((t.book||'me')!=='me')return;
    if(t.date<r.from||t.date>r.to)return;
    if(t.kind==='expense'&&t.account===a.id)spent+=Number(t.amount)||0;
    if(t.kind==='transfer'&&t.account===a.id)spent+=Number(t.amount)||0;
    if(t.kind==='transfer'&&t.to===a.id)spent-=Number(t.amount)||0;
    if(t.kind==='income'&&t.account===a.id)spent-=Number(t.amount)||0;
  });
  spent=Math.round(Math.max(0,spent)*100)/100;
  // الأقساط اللي على الكارت: قسط الشهر بس، والباقي مش مستحق دلوقتي
  const carry=Math.round((D.installments||[]).filter(i=>i.src===a.id&&i.mode!=='bank'&&!insDone(i))
    .reduce((x,i)=>x+Math.max(0,insLeft(i)-insNextAmount(i)),0)*100)/100;
  const monthly=insDueThisStmt(a.id);
  const bankAdj=(D.installments||[]).filter(i=>i.mode==='bank'&&i.src===a.id).reduce((x,i)=>{
    const e=insSchedule(i).find(s=>s.key===key);if(!e)return x;
    return e.k===1?x-((Number(i.principal)||0)-e.prin):x+e.prin;},0);
  const base=Math.round(Math.max(0,spent-carry+bankAdj)*100)/100;
  /* التأمين بقى حركة لوحده يوم ١ (insuranceAll)، فبيدخل في «spent» جوه الدورة */
  const fee=0;
  return {owed:spent,carry:carry,monthly:monthly,base:base,fee:fee,
    from:r.from,to:r.to,
    total:Math.round((base+fee)*100)/100};
}

const insOnAccount=id=>(D.installments||[]).filter(i=>i.src===id&&i.mode!=='bank'&&!insDone(i)).reduce((a,i)=>a+insLeft(i),0);

  const r=Math.round((t-(Number(i.monthly)||0)*(Number(i.months)||0))*100)/100;return r>0.005?r:0;};

const certMonthly=(amount,rate)=>Math.round((Number(onlyNum(amount))||0)*(Number(onlyNum(rate))||0)/1200*100)/100;

const dInMonth=m=>{const p=m.split('-');return new Date(Number(p[0]),Number(p[1]),0).getDate();};
const certDay=c=>Number(c.day)||Number(String(c.start||'').slice(8,10))||1;

function autoTrials(){
  const done=[];
  (D.subs||[]).forEach(s=>{
    if(s.cycle!=='trial'||!s.willRenew)return;
    if(daysTo(s.next)>0)return;
    if(!(Number(s.amount)>0))return;
    s.cycle=s.afterCycle||'monthly';s.account='card';s.cat='subs';s.cancelAtEnd=false;
    s.willRenew=undefined;s.afterCycle=undefined;
    done.push(s.name);
  });

function chargedAlready(s){
  // عدّى وقت الخصم؟
  if(daysTo(s.next)<0)return true;
  if(daysTo(s.next)>0)return false;
  if(!s.at)return true;
  const p=String(s.at).split(':');
  const n=new Date();
  return (n.getHours()*60+n.getMinutes())>=((Number(p[0])||0)*60+(Number(p[1])||0));
}
function chargeSub(s,d){
  const usd=s.cur==='USD'?Number(s.amount):0;
  const full=usd?Math.round(usd*D.rate*100)/100:Number(s.amount);
  if(!(full>0))return null;
  const t={id:uid(),book:'me',kind:'expense',amount:full,
    cat:s.cat||'subs',account:s.account||'card',date:d,note:s.name,
    usd:usd||undefined,rate:usd?D.rate:undefined,pending:usd?true:undefined};
  D.txns.unshift(t);
  if(!s.payments)s.payments=[];
  const pay={d:d,t:t.id,paid:full,auto:true};
  if(s.cur!=='USD'){
    const est=Math.round(full*0.03*100)/100;
    if(est>0){pay.fee=est;pay.feePending=true;}
  }
  s.payments.push(pay);
  if(subShared(s)){
    if(!s.dues)s.dues=[];
    const ppl=subPeople(s);
    if(ppl.length){
      ppl.forEach(p=>{
        const amt=usd?Math.round(Number(p.amount)*D.rate*100)/100:Number(p.amount);
        if(amt>0.01)s.dues.push({id:uid(),who:p.name,amount:amt,date:d,got:false,srcTxn:t.id});
      });
    }else{
      const mineEgp=usd?Math.round(subMine(s)*D.rate*100)/100:subMine(s);
      const owed=Math.round((full-mineEgp)*100)/100;
      if(owed>0.01)s.dues.push({id:uid(),amount:owed,date:d,got:false,srcTxn:t.id});
    }
  }
  s.next=dAdd(s.next,s.cycle==='yearly'?12:1);
  return {name:s.name,amount:full};
}
function autoCharge(){
  const done=[];
  (D.subs||[]).forEach(s=>{
    if(s.cycle==='trial'||subEnded(s))return;
    let guard=0;
    while(guard++<24&&chargedAlready(s)){
      const d=s.next;
      const r=chargeSub(s,d);
      if(!r)break;
      done.push(r);
    }
  });
  if(done.length){sortTxns();save();}
  return done;
}
function catchUp(){
  let n=0,tot=0;
  (D.certs||[]).forEach(c=>{
    let guard=0;
    while(guard++<200){
      const d=certNext(c);
      if(d>today())break;
      if(c.end&&d>c.end)break;
      const t={id:uid(),book:'me',kind:'income',amount:Number(c.monthly),account:c.account,date:d,note:c.name+' — عائد'};
      D.txns.unshift(t);
      c.covered=monthOf(d);
      if(!c.payments)c.payments=[];
      c.payments.push({d:d,t:t.id});
      n++;tot+=Number(c.monthly);
    }
  });
  if(n){sortTxns();save();}
  return {n:n,tot:tot};
}

const cycleLabel=s=>s.cycle==='trial'?'تجربة مجانية':s.cycle==='yearly'?'سنوي':'شهري';
const subCost=s=>s.cur==='USD'?Number(s.amount)*D.rate:Number(s.amount);
const subPeople=s=>(s.people&&s.people.length)?s.people:[];
const subOthers=s=>subPeople(s).reduce((a,p)=>a+(Number(p.amount)||0),0);
const subMine=s=>{
  if(subPeople(s).length)return Math.max(0,Number(s.amount)-subOthers(s));
  return (s.myShare===null||s.myShare===undefined)?Number(s.amount):Number(s.myShare);
};
const subMineCost=s=>s.cur==='USD'?subMine(s)*D.rate:subMine(s);
const subShared=s=>subMine(s)<Number(s.amount)-0.001;
const subLastPay=s=>{

const subFeeEst=s=>Number(s.feeEst)||0;
const openDues=s=>(s.dues||[]).filter(d=>!d.got);
const subEnded=s=>!!s.cancelAtEnd&&daysTo(s.next)<=0;
function beforeChargeTime(s){
  if(!s.at||daysTo(s.next)!==0)return false;
  const p=String(s.at).split(':');

}
const subSoon=s=>subEnded(s)?false:(s.cycle==='trial'?daysTo(s.next)<=14
  :(!s.cancelAtEnd&&daysTo(s.next)<=3&&!beforeChargeTime(s)));
const yearly=s=>(s.cycle==='trial'||subEnded(s))?0:(s.cycle==='yearly'?(subMineCost(s)+subFeeEst(s)):(subMineCost(s)+subFeeEst(s))*12);

async function ghApi(path,opts){
  opts=opts||{};
  const headers={'Authorization':'token '+ghToken,'Content-Type':'application/json'};
  const r=await fetch('https://api.github.com'+path,{method:opts.method||'GET',headers:headers,
    body:opts.body?JSON.stringify(opts.body):undefined});
  if(!r.ok){const err=new Error('gh:'+r.status);err.status=r.status;throw err;}
  return r.json();
}
async function ghFindGist(){
  for(let page=1;page<=3;page++){
    const list=await ghApi('/gists?per_page=100&page='+page);
    const hit=list.find(g=>g.description===GIST_DESC);
    if(hit)return hit.id;
    if(list.length<100)break;
  }
  return null;
}
async function ghCreateGist(){
  const g=await ghApi('/gists',{method:'POST',body:{description:GIST_DESC,public:false,
    files:{[GIST_FILE]:{content:JSON.stringify(D)}}}});
  return g.id;
}
async function ghGetRemote(id){
  const g=await ghApi('/gists/'+id);
  const f=g.files&&g.files[GIST_FILE];
  if(!f||!f.content)return null;
  try{return JSON.parse(f.content);}catch(e){return null;}
}
async function ghPatch(id,dataStr){
  await ghApi('/gists/'+id,{method:'PATCH',body:{files:{[GIST_FILE]:{content:dataStr}}}});
}
function ghErrMsg(err){
  if(err&&err.status===401)return 'المفتاح غلط أو مالوش صلاحية gist. راجعه من github.com/settings/tokens.';
  if(err&&err.status===403)return 'حصل تجاوز لحد الطلبات، جرب تاني بعد شوية.';
  if(err&&err.status)return 'حصل خطأ من GitHub (كود '+err.status+').';
  return 'مقدرتش أوصل لـ GitHub. اتأكد إن عندك إنترنت.';
}
let ghLastPull=0;
function ghMaybePull(){
  if(!ghToken||!ghGist)return;
  const now=Date.now();
  if(now-ghLastPull<60000)return;
  ghLastPull=now;
  ghReconcile();
}
function scheduleGhPush(){
  if(!ghToken||!ghGist)return;
  clearTimeout(ghPushTimer);
  ghPushTimer=setTimeout(()=>{ghPatch(ghGist,JSON.stringify(D)).then(()=>{
    D.ghLastSync=new Date().toISOString();
    try{localStorage.setItem(SKEY,JSON.stringify(D));}catch(e){}
    if(tab==='settings')render();
  }).catch(()=>{});},2500);
}
async function ghReconcile(){
  if(!ghToken||!ghGist)return;
  ghState.busy=true;render();
  try{
    const remote=await ghGetRemote(ghGist);
    const localSv=D._sv||0, remoteSv=(remote&&remote._sv)||0;
    if(remote&&remoteSv>localSv){
      D=remote;normalizeData();
      D.ghLastSync=new Date().toISOString();
      try{localStorage.setItem(SKEY,JSON.stringify(D));}catch(e){}
      app.toast('اتزامنت البيانات من جهاز تاني');
    }else{
      await ghPatch(ghGist,JSON.stringify(D));
      D.ghLastSync=new Date().toISOString();
      try{localStorage.setItem(SKEY,JSON.stringify(D));}catch(e){}
    }
    ghState.msg='';
  }catch(err){ghState.msg=ghErrMsg(err);}
  ghState.busy=false;render();
}
async function ghConnect(){
  const el=document.getElementById('ghtokin');
  const tok=el?el.value.trim():'';
  if(!tok){ghState.msg='محتاج تلصق المفتاح الأول.';render();return;}
  ghState.busy=true;ghState.msg='';render();
  try{
    ghToken=tok;
    let id=await ghFindGist();
    if(!id)id=await ghCreateGist();
    ghGist=id;
    try{localStorage.setItem(GKEY,ghToken);localStorage.setItem(GIDKEY,ghGist);}catch(e){}
    ghState.busy=false;render();
    await ghReconcile();
  }catch(err){
    ghToken='';ghGist='';
    try{localStorage.removeItem(GKEY);localStorage.removeItem(GIDKEY);}catch(e){}
    ghState.busy=false;ghState.msg=ghErrMsg(err);render();
  }
}

async function shrink(file){
  const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(0);r.readAsDataURL(file);});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(0);i.src=url;});
  const s=Math.min(1,1400/Math.max(img.width,img.height));
  const c=document.createElement('canvas');
  c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.85).split(',')[1];
}

function vehTxns(id){
  return D.txns.filter(t=>(t.book||'me')==='me'&&t.kind==='expense'&&t.veh===id);
}
function vehFuel(id){
  return vehTxns(id).filter(t=>t.cat==='fuel'&&(Number(t.liters)||0)>0)
    .slice().sort((a,b)=>{
      if(a.date!==b.date)return a.date<b.date?-1:1;
      return (Number(a._q)||0)-(Number(b._q)||0);
    });
}
function vehStats(id){
  const fuels=vehFuel(id);
  const withOdo=fuels.filter(t=>Number(t.odo)>0);
  let kmPerL=0,costPerKm=0,dist=0,liters=0,cost=0;
  if(withOdo.length>=2){
    // رتّب بقراءة العداد نفسها عشان أي تعبئتين في نفس اليوم ما يقلبوش الحسبة
    const last=withOdo.slice(-4).slice().sort((a,b)=>(Number(a.odo)||0)-(Number(b.odo)||0));
    dist=Math.max(0,(Number(last[last.length-1].odo)||0)-(Number(last[0].odo)||0));
    for(let i=1;i<last.length;i++){
      liters+=Number(last[i].liters)||0;
      cost+=Number(last[i].amount)||0;
    }
    if(liters>0)kmPerL=Math.round((dist/liters)*100)/100;
    if(dist>0)costPerKm=Math.round((cost/dist)*100)/100;
  }
  const all=vehTxns(id);
  const lastFuel=fuels.length?fuels[fuels.length-1]:null;
  const fixes=all.filter(t=>t.cat==='repair').slice().sort((a,b)=>a.date<b.date?1:-1);
  return {kmPerL:kmPerL,costPerKm:costPerKm,
    total:Math.round(all.reduce((a,t)=>a+(Number(t.amount)||0),0)*100)/100,
    fuelTotal:Math.round(all.filter(t=>t.cat==='fuel').reduce((a,t)=>a+(Number(t.amount)||0),0)*100)/100,
    lastFuel:lastFuel, lastFix:fixes[0]||null,
    odo:withOdo.length?Number(withOdo[withOdo.length-1].odo):0};
}

    pills=pers.slice(0,12).map(p=>`<button class="mpill${p.key===cur.key?' on':''}" onclick="app.setMonth('${p.key}')">${p.label}</button>`).join('');
    periodNote=cur.to==='9999-12-31'?('من '+shortDay(cur.from)+' لحد دلوقتي'):('من '+shortDay(cur.from)+' لـ '+shortDay(cur.to));
  }else{
    const ms=[...new Set(mine.map(t=>monthOf(t.date)).concat([monthOf(today())]))].filter(Boolean).sort().reverse();
    mt=mine.filter(t=>monthOf(t.date)===month);
    pills=ms.map(x=>`<button class="mpill${x===month?' on':''}" onclick="app.setMonth('${x}')">${mLabel(x)}</button>`).join('');
    periodNote='سجّل مرتبك عشان الشهر يبدأ من يوم القبض';
  }
  const spent=mt.filter(t=>t.kind==='expense').reduce((a,t)=>a+mySpend(t),0);
  const earned=mt.filter(t=>t.kind==='income'&&!t.repay).reduce((a,t)=>a+Number(t.amount),0);
  const m={};
  mt.filter(t=>t.kind==='expense').forEach(t=>breakdown(t).forEach(x=>m[x.cat]=(m[x.cat]||0)+x.amount));
  const byCat=Object.entries(m).sort((a,b)=>b[1]-a[1]);
  const gross=byCat.reduce((a,x)=>a+x[1],0)||1;
  const max=byCat.length?byCat[0][1]:1;

  return `
  ${autoMsg?`<div class="note ok" style="margin-top:18px;display:flex;align-items:flex-start;gap:10px">
    <span style="flex:1">${esc(autoMsg)}</span>
    <button onclick="app.closeAutoMsg()" aria-label="إغلاق"
      style="background:none;border:0;color:inherit;opacity:.6;font:inherit;font-size:17px;line-height:1;cursor:pointer;padding:0 2px">×</button>
  </div>`:''}
  ${alertsPanel()}

  <div class="sec" style="margin-top:24px">
    <div class="panel">${accountsFor('me').map(a=>acctRow(a,b)).join('')}</div>
  </div>

  <div class="sec">
    <div class="sec-h"><h3>حركة الشهر</h3><span>${esc(periodNote)}</span></div>
    <div class="mpills">${pills}</div>
    <div class="stats" style="margin-top:14px">
      <div class="stat"><b style="color:var(--clay)">${fmt(spent)}</b><span>صرفت</span></div>
      <div class="stat"><b style="color:var(--mint)">${fmt(earned)}</b><span>دخل</span></div>
      <div class="stat"><b style="color:${earned-spent<0?'var(--clay)':'var(--mint)'}">${fmt(earned-spent)}</b><span>الفرق</span></div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-h" onclick="app.toggleCats()" style="cursor:pointer">
      <h3>راح فين</h3>
      <span>${byCat.length?byCat.length+' تصنيف · '+fmt(gross):''} ${byCat.length?(catsOpen?'▲':'▼'):''}</span>
    </div>
    ${!catsOpen?'':`
    ${(function(){const u=mt.reduce((a,t)=>a+vchUsed(t),0);
      return u?`<div class="hint" style="margin:-4px 0 14px">منهم <span class="n">${fmt(u)}</span> جنيه اتغطوا بفاوتشرات، يعني اللي خرج من جيبك فعلًا أقل.</div>`:'';})()}
    ${byCat.length?byCat.map(([id,v])=>{const c=catOf(id);return `
      <div class="cat">
        <div class="cat-t"><span>${c.label}</span>
          <span class="r"><span class="pc">${Math.round(v/gross*100)}%</span>
          <span class="am" style="color:${c.color}">${fmt(v)}</span></span></div>
        <div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,(v/max)*100))}%;background:${c.color}"></div></div>
      </div>`}).join(''):'<div class="empty">مفيش مصاريف مسجلة الشهر ده.</div>'}`}
  </div>

  <div class="sec">
    <div class="sec-h"><h3>آخر حاجات</h3></div>
    ${mine.length?mine.slice(0,6).map(txnRow).join(''):
      '<div class="empty">لسه مفيش حركات.<br>ابدأ بصورة فاتورة أو إضافة يدوي.</div>'}
  </div>`;
}

      <button class="btn" onclick="app.confirmRefundBack('${t.id}')">سجّل الاسترداد</button>

      <button class="chip sm" onclick="app.saveWithdrawDone('${a.id}')">خلاص</button>
    </div>`);});}

  if(book==='me')(D.installments||[]).filter(insDue).forEach(i=>rows.push(`

      <span class="g"><span class="t">${esc(i.name)}</span>

      <span class="vl" style="white-space:nowrap">${money(i.monthly,'EGP')}</span>

  if(book==='me')(D.subs||[]).filter(s=>subSoon(s)&&!(s.hideUntil===s.next&&daysTo(s.next)>0)).forEach(s=>rows.push(`

      <span class="g"><span class="t">${esc(s.name)}</span>
        <span class="s" style="display:block">${s.cycle==='trial'?(daysTo(s.next)<=0?(s.willRenew?'التجربة خلصت — حوّلها لاشتراك':'التجربة خلصت — كنت هتلغيها'):'التجربة بتنتهي'):cycleLabel(s)} · ${whenLabel(s.next)}</span></span>

${s.cycle==='trial'

        :(daysTo(s.next)<=0?`<button class="chip sm" onclick="app.paySub('${s.id}')">سجّل</button>`:'')}
      ${daysTo(s.next)>0?`<button class="chip sm" onclick="app.hideSubAlert('${s.id}')">شفتها</button>`:''}
    </div>`));

  if(book==='me')(D.vouchers||[]).filter(v=>vchOpen(v)&&v.expiry&&daysTo(v.expiry)<=14).forEach(v=>rows.push(`

      <span class="vl" style="white-space:nowrap">${money(v.amount,'EGP')}</span>
      <button class="chip sm" onclick="app.goVouchers()">شوفه</button>
    </div>`));

  (function(){if(book!=='me')return;const bb=balances(book);
    accountsFor(book).forEach(a=>{
      const v=bb[a.id]||0;
      if(v>=-0.01)return;
      rows.push(`<div class="alert">
        <span class="rail" style="background:var(--clay)"></span>
        <span class="g"><span class="t">${esc(a.name)} بالسالب</span>
          <span class="s" style="display:block">غالبًا فيه حركة ناقصة أو مبلغ اتسجل غلط</span></span>
        <span class="vl" style="color:var(--clay);white-space:nowrap">${money(v,'EGP')}</span>
        <button class="chip sm" onclick="app.goAccounts()">شوفه</button>
      </div>`);});})();

  if(book==='me'&&Math.abs(loanBalance())>0.01)rows.push(`
    <div class="alert">
      <span class="rail" style="background:#C4A484"></span>
      <span class="g"><span class="t">${loanBalance()>0?'عليك للعهدة':'العهدة عليها ليك'}</span>
        <span class="s" style="display:block">${loanBalance()>0?'فلوس من كاش العهدة معاك — رجّعها':'حطيت من فلوسك في العهدة'}</span></span>
      <span class="vl" style="white-space:nowrap">${money(Math.abs(loanBalance()),'EGP')}</span>
      <button class="chip sm" onclick="app.goLoans()">${loanFor?'إخفاء':'سوّها'}</button>
    </div>
    ${loanFor?`<div class="inline">
      <label class="f">${loanBalance()>0?'رجّعت كام للعهدة؟':'أخدت كام من العهدة؟'}</label>
      <input class="f" id="loanin" type="text" inputmode="decimal" value="${Math.abs(loanBalance())}" oninput="numFix(this,1)">
      <button class="btn" onclick="app.settleLoan()">سجّل</button>
      <button class="btn ghost" onclick="app.cancelLoan()">إلغاء</button>
    </div>`:''}`);

  if(book==='office')(function(){
    const b=balances('office');
    D.accounts.forEach(a=>{
      const v=b[a.id]||0;
      if(v>=-0.01)return;
      rows.push(`<div class="alert">
        <span class="rail" style="background:var(--mint)"></span>
        <span class="g"><span class="t">دفعت من فلوسك — ${esc(a.name)}</span>
          <span class="s" style="display:block">المبلغ ده ليك في العهدة</span></span>
        <span class="vl" style="color:var(--mint);white-space:nowrap">${money(Math.abs(v),'EGP')}</span>
        <button class="chip sm" onclick="app.startRefund('${a.id}')">${refundFor===a.id?'إخفاء':'استردها'}</button>
      </div>
      ${refundFor===a.id?`<div class="inline">
        <label class="f">تاخدها من أنهي حساب عهدة؟ <b>*</b></label>
        ${(function(){const ob=balances('office');
          const opts=D.accounts.filter(x=>x.id!==a.id&&!x.credit&&!isSave(x)&&(ob[x.id]||0)>0.01);
          if(!opts.length)return '<div class="hint">مفيش رصيد عهدة في أي حساب دلوقتي — استناها لحد ما توصل عهدة جديدة.</div>';
          return '<div class="chips">'+opts.map(x=>`<button class="chip sm${refundParts[x.id]!==undefined?' on':''}" onclick="app.toggleRefundPart('${x.id}',${Math.abs(v)})">${esc(x.name)} · <span class="n">${fmt(ob[x.id])}</span></button>`).join('')+'</div>'
            +opts.filter(x=>refundParts[x.id]!==undefined).map(x=>`
              <label class="f">هتاخد كام من ${esc(x.name)}؟</label>
              <input class="f" type="text" inputmode="decimal" value="${esc(refundParts[x.id])}" oninput="app.setRefundPart('${x.id}',numFix(this,1))">`).join('')
            +(Object.keys(refundParts).length>1?`<div class="hint">المجموع <span class="n" id="refsum">${fmt(refundTotal())}</span> من <span class="n">${fmt(Math.abs(v))}</span></div>`:'');})()}
        <label class="f">وتدخل على أنهي حساب من حساباتك؟ <b>*</b></label>
        ${payChips(refundTo,'app.setRefundTo','','me')}
        ${(function(){const need=Math.abs(v), got=refundTotal(), d=Math.round((got-need)*100)/100;

            : `<div class="hint">المستحق <span class="n">${fmt(need)}</span> · هتاخد <span class="n">${fmt(got)}</span> · الباقي <span class="n">${fmt(-d)}</span> هيفضل ليك في العهدة.</div>`;})()}

        <button class="btn ghost" onclick="app.dropOwedGroup('${esc(gid)}')">شيلها خالص</button>
        <button class="btn ghost" onclick="app.cancelOwedGet()">إلغاء</button>
      </div>`:''}`;
    });
    rows.push(`<div class="alert" onclick="app.toggleOwedPanel()" style="cursor:pointer">
      <span class="rail" style="background:var(--mint)"></span>
      <span class="g"><span class="t">فلوس ليك</span>
        <span class="s" style="display:block">${keys.length} ${keys.length===1?'شخص':'ناس'} · ${items.length} مستحق</span></span>
      <span class="vl" style="color:var(--mint);white-space:nowrap">${money(grand,'EGP')}</span>
      <span style="color:var(--muted);font-size:12px">${owedOpen?'▲':'▼'}</span>
    </div>${owedBody}`);
  })();

  if(book==='me')(D.subs||[]).forEach(s=>subDups(s).forEach(p=>{
    const usd=s.cur==='USD';

    rows.push(`
    <div class="alert" style="flex-wrap:wrap">
      <span class="rail" style="background:var(--clay)"></span>
      <span class="g"><span class="t">سحب متكرر — ${esc(s.name)}</span>
        <span class="s" style="display:block">اتسحب تاني ${dLabel(p.d)}${
          usd?` · <span class="n">${fmt(p.paid)}</span> تقديري`:(p.feePending?` · تدبير تقديري <span class="n">${fmt(p.fee)}</span>`:'')}</span></span>
      <span class="vl" style="white-space:nowrap">${usd?money(s.amount,'USD'):money(p.paid,'EGP')}</span>
      <div class="chips" style="flex-basis:100%;margin:10px 0 0">
        <button class="chip sm" onclick="app.undoDup('${s.id}','${p.t}')">رجعت</button>
        <button class="chip sm" onclick="app.startFeeFix('${esc(key)}')">${feeFor===key?'إخفاء':'ظبّط'}</button>
      </div>
    </div>
    ${feeFor===key?`<div class="inline">
      <label class="f">${usd?'اتخصم كام بالجنيه؟':'التدبير اتخصم كام؟'}</label>
      <input class="f" id="feein" type="text" inputmode="decimal" value="${usd?p.paid:(p.fee||0)}" oninput="numFix(this,1)">
      <button class="btn" onclick="app.confirmFee('${esc(key)}')">أكد</button>
      ${usd?'':`<button class="btn ghost" onclick="app.noFee('${esc(key)}')">مفيش تدبير</button>`}
      <button class="btn ghost" onclick="app.cancelFee()">إلغاء</button>
    </div>`:''}`);
  }));

  if(book==='me')(D.subs||[]).forEach(s=>{
    if(s.cur==='USD')return;
    (s.payments||[]).filter(p=>p.feePending&&!p.dup).forEach(p=>{
      const key=s.id+'|'+p.t;
      rows.push(`<div class="alert">
        <span class="rail" style="background:#C4A484"></span>
        <span class="g"><span class="t">تدبير عملة — ${esc(s.name)}${p.dup?' (سحب متكرر)':''}</span>
          <span class="s" style="display:block">دفعة ${dLabel(p.d)} · تقديري ٣٪ · لسه ماتخصمش</span></span>
        <span class="vl" style="white-space:nowrap">${money(p.fee,'EGP')}</span>
        <button class="chip sm" onclick="app.startFeeFix('${esc(key)}')">${feeFor===key?'إخفاء':'ظبّط'}</button>
      </div>
      ${feeFor===key?`<div class="inline">
        <label class="f">اتخصم كام بالظبط؟</label>
        <input class="f" id="feein" type="text" inputmode="decimal" value="${p.fee}" oninput="numFix(this,1)">
        <button class="btn" onclick="app.confirmFee('${esc(key)}')">أكد</button>
        <button class="btn ghost" onclick="app.noFee('${esc(key)}')">مفيش تدبير خالص</button>

  if(book==='me'&&ofeeBalance()>=Number(D.ofeeLimit||200))rows.push(`
    <div class="alert">

  if(book==='me'&&(!D.lastBackup||daysTo(D.lastBackup)<-30))rows.push(`
    <div class="alert">
      <span class="rail" style="background:#8FA0C4"></span>
      <span class="g"><span class="t">نسخة احتياطية</span>
        <span class="s" style="display:block">${D.lastBackup?('آخر نسخة من '+dayLabel(D.lastBackup)):'لسه معملتش نسخة من بياناتك'}</span></span>
      <button class="chip sm" onclick="app.exportData()">اعملها</button>
    </div>`);

  if(!rows.length)return '';
  /* الصندوق مقفول افتراضيًا، وبيتفتح لوحده لو فيه تنبيه ماكانش موجود المرة اللي فاتت.
     هوية التنبيه = أول زرار فيه بالـ id بتاعه، ولو مفيش = عنوانه. */
  const akey=r=>{
    const m=r.match(/app\.(\w+)\('([^']*)'/);
    if(m)return m[1]+':'+m[2];
    const tt=r.match(/<span class="t">([\s\S]*?)<\/span>/);
    return tt?'t:'+tt[1].trim():r.slice(0,80);

  const keys=rows.map(akey);
  let seen=null;
  try{seen=JSON.parse(localStorage.getItem(ASEEN+book)||'null');}catch(e){}

  const title=(t.book==='office')?(t.kind==='float'?('استلام عهدة'+(t.note?' — '+t.note:'')):(t.item||t.note||t.merchant||'بند')):(t.note||t.merchant||(inc?'دخل':tr?'تحويل':c.label));

  </div>
  ${openTxn===t.id?`<div class="detail">
    ${(t.items||[]).map(i=>`<div class="d"><span>${esc(i.name)} <span style="color:${catOf(i.cat).color}">· ${catOf(i.cat).label}</span></span><span class="n">${fmt(i.amount)}</span></div>`).join('')}
    ${(function(){
      const locked=(t.book==='office')&&(t.kind==='settle'||(D.lastClose&&t.date<=D.lastClose));
      if(locked)return `<div class="hint">${t.kind==='settle'?'دي حركة تسوية تقفيل.':'الحركة دي جوه فترة متقفلة.'} عشان تعدلها اتراجع عن التقفيل الأول.</div>`;
      return eTxn&&eTxn.id===t.id?txnEditForm(t):`<div class="chips" style="margin-top:10px">

        ${delBtn('txn'+t.id,`app.delTxn(event,'${t.id}')`,'امسح')}

function entryOk(){const k=draft.kind;
  if(k==='expense'&&draft.account==='vcash'&&draft.vc==='withdraw')
    return !!(Number(onlyNum(draft.amount))>0&&draft.to2&&draft.to2!=='vcash');
  const lent=k==='expense'&&draft.owed&&draft.owedKind==='lent';
  return !!(Number(onlyNum(draft.amount))>0&&draft.account&&(k!=='expense'||lent||draft.cat)&&(k!=='transfer'||(draft.to&&draft.to!==draft.account)));}
function subOk(){
  if(!subDraft.name.trim()||!subDraft.next)return false;
  if(subDraft.cycle==='trial')return subDraft.willRenew?Number(onlyNum(subDraft.amount))>0:true;
  return Number(onlyNum(subDraft.amount))>0;}
function insOk(){
  if(isCreditAcc(insDraft.src))return !!(insDraft.name.trim()&&(Number(onlyNum(insDraft.total))||0)>0
    &&(Number(onlyNum(insDraft.months))||0)>0&&(Number(onlyNum(insDraft.monthly))||0)>0);
  return !!(insDraft.name.trim()&&Number(onlyNum(insDraft.monthly))>0&&Number(onlyNum(insDraft.months))>0&&insDraft.account&&insDraft.src);}
function certOk(){return !!(Number(onlyNum(certDraft.amount))>0&&Number(onlyNum(certDraft.monthly))>0&&certDraft.start&&certDraft.account);}

function peopleNames(){
  const out=[];
  (D.owed||[]).forEach(o=>{const n=String(o.who||'').trim();if(n&&out.indexOf(n)<0)out.push(n);});
  (D.subs||[]).forEach(s=>(s.people||[]).forEach(p=>{const n=String(p.name||'').trim();if(n&&out.indexOf(n)<0)out.push(n);}));
  return out.slice(0,8);
}
function itemNames(){
  const seen=[],out=[];
  D.txns.filter(t=>t.book==='office'&&t.kind==='expense'&&t.item).forEach(t=>{
    const n=normItem(t.item);
    if(n&&seen.indexOf(n)<0){seen.push(n);out.push(n);}});
  return out.slice(0,8);
}
function itemSuggestions(fn){
  const n=itemNames();
  if(!n.length)return '';
  return `<div class="chips" style="margin-top:10px">${n.map(x=>`<button class="chip sm" onclick="${fn}('${esc(x).replace(/'/g,"&#39;")}')">${esc(x)}</button>`).join('')}</div>`;
}
function oOk(){const k=draftO.kind;
  if(k==='loan')return Number(onlyNum(draftO.amount))>0;
  if(k==='xfer')return !!(Number(onlyNum(draftO.amount))>0&&draftO.account&&draftO.to&&draftO.to!==draftO.account);
  return !!(Number(onlyNum(draftO.amount))>0&&draftO.account&&(k==='float'||(draftO.item.trim()&&draftO.ocat))&&(!draftO.toMe||draftO.to));}

function scanMyShare(){
  const mine=(scan.items||[]).filter(i=>!i.off&&!i.who).reduce((a,i)=>a+(Number(i.amount)||0),0);

}

function groupedItems(r){
  const m={};
  (r.items||[]).forEach(i=>{
    const k=i.ocat||'other';
    if(!m[k])m[k]={ocat:k,items:[],sum:0};
    m[k].items.push(i);
    m[k].sum=Math.round((m[k].sum+Number(i.sum))*100)/100;
  });
  const order=D.ocats.map(c=>c.id);
  return Object.keys(m).map(k=>m[k])
    .sort((a,b)=>{
      const ia=order.indexOf(a.ocat), ib=order.indexOf(b.ocat);
      return (ia<0?99:ia)-(ib<0?99:ib);
    })
    .map(g=>({ocat:g.ocat,sum:g.sum,items:g.items.slice().sort((a,b)=>b.sum-a.sum)}));
}

function wVouchers(){
  const src=D.vouchers||[];
  const list=src.map((v,i)=>({v:v,i:i}))
    .sort((a,b)=>{
      const da=String(a.v.added||a.v.expiry||''), db=String(b.v.added||b.v.expiry||'');
      if(da!==db)return da<db?1:-1;
      return b.i-a.i;
    }).map(x=>x.v);
  const live=list.filter(vchLive);
  const tot=live.reduce((a,v)=>a+(Number(v.amount)||0),0);
  const ok=vchDraft.code.trim()&&Number(onlyNum(vchDraft.amount))>0&&vchDraft.expiry;
  return `<div style="margin-top:18px">
    <button class="btn ghost" style="margin:0 0 20px" onclick="app.toggleVch()">${showVch?'إلغاء':'زوّد فاوتشر'}</button>
    ${showVch?`
      <label class="f">رقم الفاوتشر <b>*</b></label>
      <input class="f n" id="vchcode" type="text" inputmode="numeric" style="text-align:center;letter-spacing:1px"
        value="${esc(vchDraft.code)}" oninput="app.vchSet('code',this.value,this)">
      <button class="btn ghost" style="margin-top:10px" onclick="app.pasteCode()">الصق الرقم من الحافظة</button>

      <label class="f">قيمته <b>*</b></label>
      <input class="f" type="text" inputmode="decimal" value="${esc(vchDraft.amount)}" oninput="app.vchSet('amount',numFix(this,1))">

      <label class="f">آخر ٦ أرقام من البطاقة</label>
      <input class="f n" style="text-align:center;letter-spacing:1px;color:var(--muted)" value="${esc(D.cardDigits)}" readonly disabled>

      <label class="f">رقم الموبايل</label>
      <input class="f n" style="text-align:center;letter-spacing:1px;color:var(--muted)" value="${esc(D.phone)}" readonly disabled>

      <label class="f">تاريخ الانتهاء <b>*</b></label>
      <input class="f" type="date" value="${vchDraft.expiry}" onchange="app.vchSet('expiry',this.value)">

      <button class="btn" id="vchsave" ${ok?'':'disabled'} onclick="app.addVch()">احفظ الفاوتشر</button>
    `:''}

    <div class="hint" style="margin-top:18px">الفاوتشر بيستخدم مرة واحدة بالكامل. وقت ما تسجل مصروف أو فاتورة هتلاقي خانة تختار منها الفاوتشر، وقيمته كلها هتتخصم من المبلغ.</div>
    ${live.length?`<div class="stats" style="margin-bottom:16px">
      <div class="stat"><b style="color:var(--mint)">${fmt(tot)}</b><span>متاح تصرفه</span></div>
      <div class="stat"><b>${live.length}</b><span>فاوتشر شغال</span></div>
    </div>`:''}

    ${list.length?list.map(v=>{
      const dead=!vchLive(v);
      return `<div class="panel" style="padding:15px 16px;margin-bottom:10px;${dead?'opacity:.5':''}">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
          <span class="n" style="font-size:16px;font-weight:600;letter-spacing:1px">${esc(v.code)}</span>
          <span class="n" style="font-size:15px;font-weight:600;color:${dead?'var(--muted)':'var(--mint)'}">${fmt(v.amount)}</span>
        </div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.8">
          بنك CIB · بطاقة <span class="n">${esc(v.card)}</span><br>
          ${v.used?((v.usedBy?'استخدمه '+esc(v.usedBy):'استخدم')+(v.usedOn?atDay(v.usedOn):''))
            :v.given?('مبعوت'+(v.givenTo?' لـ'+esc(v.givenTo):'')+' · بينتهي '+dayLabel(v.expiry))
            :(daysTo(v.expiry)<0?'انتهى في '+dayLabel(v.expiry):'بينتهي '+dayLabel(v.expiry)+' · '+whenLabel(v.expiry))}
        </div>
        ${v.used?`<div class="chips" style="margin-top:12px">
          ${delBtn('vch'+v.id,`app.delVch('${v.id}')`)}
        </div>`:`<div class="chips" style="margin-top:12px">
          <button class="chip sm" onclick="app.shareVch('${v.id}')">${copied==='s'+v.id?'اتنسخ':'شاركه'}</button>
          ${v.given?`<button class="chip sm" onclick="app.friendUsed('${v.id}')">صاحبك استخدمه</button>
                     <button class="chip sm" onclick="app.ungive('${v.id}')">رجّعه ليا</button>`

          ${delBtn('vch'+v.id,`app.delVch('${v.id}')`)}

            value="${esc(eDraft.code)}" oninput="app.eSet('code',this.value,this)">

          <input class="f" id="evamt" type="text" inputmode="decimal" value="${esc(eDraft.amount)}" oninput="app.eSet('amount',numFix(this,1))">
          <label class="f">تاريخ الانتهاء</label>
          <input class="f" id="evexp" type="date" value="${eDraft.expiry}" onchange="app.eSet('expiry',this.value)">

          <button class="btn ghost" onclick="app.cancelEdit()">إلغاء</button>
        </div>`:''}
        ${giveFor===v.id?`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
          <label class="f">بعته لمين؟ (اختياري)</label>
          <input class="f" id="giveto" placeholder="اسم صاحبك">
          <button class="btn" onclick="app.confirmGive('${v.id}')">علّمه إنه اتبعت</button>
          <button class="btn ghost" onclick="app.cancelGive()">إلغاء</button>
        </div>`:''}
      </div>`}).join(''):'<div class="empty" style="padding:18px 10px">مفيش فاوتشرات مسجلة.</div>'}

  </div>`;
}

function vchPicker(selId,total,fnPick){
  const live=(D.vouchers||[]).filter(vchLive);
  if(!live.length)return '';
  const usable=live.filter(x=>Number(x.amount)<=total);
  if(!usable.length)return `<div class="hint" style="margin-top:18px">عندك <span class="n">${live.length}</span> فاوتشر، بس قيمة أصغر واحد فيهم
    (<span class="n">${fmt(Math.min.apply(null,live.map(x=>Number(x.amount))))}</span>) أكبر من الفاتورة، فمينفعش يتستخدم دلوقتي.</div>`;
  const v=usable.find(x=>x.id===selId);
  return `<label class="f">فاوتشر (اختياري)</label>
    <div class="chips">${usable.map(x=>`<button class="chip sm${selId===x.id?' on':''}" onclick="${fnPick}('${x.id}')"><span class="n">${esc(x.code)}</span> · <span class="n">${fmt(x.amount)}</span></button>`).join('')}
      ${selId?`<button class="chip sm" onclick="${fnPick}('')">شيله</button>`:''}</div>
    ${v?`<div class="hint">هيتخصم من حسابك <span class="n">${fmt(Math.max(0,total-Number(v.amount)))}</span> جنيه بس.</div>`:''}`;
}
