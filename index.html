          ${trial?'<span class="tag">تجربة مجانية</span>':`<span style="font-size:15px;font-weight:600;white-space:nowrap">${money(s.amount,s.cur)}</span>`}
        </div>
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--muted);margin-top:10px">
          <span>${trial?'التجربة بتنتهي':(s.cancelAtEnd?(subEnded(s)?'اتوقف يوم':'هيقف يوم'):cycleLabel(s)+' · الجاي')} ${dayLabel(s.next)}${(!trial&&s.at)?' الساعة '+hhmm(s.at):''}</span>
          <span style="color:${!subEnded(s)&&daysTo(s.next)<=3?'var(--clay)':'var(--muted)'}">${subEnded(s)?'متوقف':whenLabel(s.next)}</span>
        </div>
        ${!trial&&s.cur==='USD'?`<div style="font-size:11.5px;color:var(--muted);margin-top:6px">≈ ${money(Math.round(subCost(s)),'EGP')}</div>`:''}
        ${!trial&&subShared(s)?`<div style="font-size:11.5px;color:var(--muted);margin-top:6px">نصيبك ${money(subMine(s),s.cur)}${subPeople(s).length?' · '+subPeople(s).map(p=>esc(p.name)+' '+fmt(p.amount)).join(' · '):' · الباقي على الناس'}</div>`:''}
        ${!trial&&subLastPay(s)?`<div style="font-size:11.5px;color:var(--muted);margin-top:6px">آخر دفعة: ${dLabel(subLastPay(s).d)}${
          subLastPay(s).fee?` · <span class="n">${fmt(subLastPay(s).paid||s.amount)}</span> + <span class="n">${fmt(subLastPay(s).fee)}</span> تدبير${subLastPay(s).feePending?' (تقديري — لسه ماتخصمش)':''}${subLastPay(s).feePending?'':` = <span class="n">${fmt((subLastPay(s).paid||Number(s.amount))+Number(subLastPay(s).fee))}</span>`}`:''}</div>`:''}
        ${!trial&&subLastPay(s)&&subLastPay(s).feePending?`<div class="hint">مصاريف التدبير تقديرية ٣٪ لحد ما تأكدها من «محتاج انتباهك».</div>`:''}
        ${feeFor===s.id?`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
          <label class="f">مبلغ تدبير العملة اللي اتخصم لوحده</label>
          <input class="f" id="feein" type="text" inputmode="decimal" oninput="numFix(this,1)">
          <div class="hint">هيتسجل حركة منفصلة بتصنيف عمولات ورسوم، وهيتجمع مع الاشتراك في الإجمالي.</div>
          <button class="btn" onclick="app.saveFee('${s.id}')">احفظ</button>
          <button class="btn ghost" onclick="app.cancelFee()">إلغاء</button>
        </div>`:''}
        ${trial?`<div style="font-size:11.5px;color:var(--muted);margin-top:6px">بعد التجربة: ${s.willRenew
          ?((s.afterCycle==='yearly'?'سنوي':'شهري')+' · '+money(s.amount,s.cur))
          :'هلغيها'}</div>`:''}
        <div class="chips" style="margin-top:12px">
          ${trial?`${s.willRenew?`<button class="chip sm${daysTo(s.next)<=0?' on':''}" onclick="app.convertNow('${s.id}')">حوّلها لاشتراك</button>`:''}
            <button class="chip sm" onclick="app.startConv('${s.id}')">${convFor===s.id?'إخفاء':'عدّل الخطة'}</button>`
            :subEnded(s)?`<button class="chip sm" onclick="app.resume('${s.id}')">رجّع التجديد</button>`
            :`<button class="chip sm${subSoon(s)?' on':''}" onclick="app.paySub('${s.id}')">سجّل الدفع</button>
              <button class="chip sm" onclick="app.startSubEdit('${s.id}')">${editSub===s.id?'إخفاء':'عدّل'}</button>
              <button class="chip sm" onclick="app.startUpgrade('${s.id}')">${upFor===s.id?'إخفاء':'رقّيته'}</button>
              <button class="chip sm" onclick="app.skipSub('${s.id}')">أجّل دورة</button>
              ${subLastPay(s)?`<button class="chip sm" onclick="app.startRepeat('${s.id}')">${repFor===s.id?'إخفاء':'اتسحب تاني'}</button>`:''}
              ${subLastPay(s)?`<button class="chip sm" onclick="app.undoSubPay('${s.id}')">تراجع آخر دفعة</button>`:''}
              ${s.cancelAtEnd?`<button class="chip sm" onclick="app.resume('${s.id}')">رجّع التجديد</button>`
                             :`<button class="chip sm" onclick="app.cancelEnd('${s.id}')">وقف التجديد</button>`}`}
          ${delBtn('sub'+s.id,`app.delSub('${s.id}')`)}
        </div>
        ${repFor===s.id?`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
          <div class="hint" style="margin-top:0">لو اتسحب منك مرتين في نفس الدورة، سجّل السحبة الزيادة هنا. تاريخ التجديد مش هيتغير.</div>
          <label class="f">المبلغ</label>
          <input class="f" id="repamt" type="text" inputmode="decimal" value="${s.amount}" oninput="numFix(this,1)">
          <label class="f">التاريخ</label>
          ${dateField(repDate,'app.setRepDate')}
          <button class="btn" onclick="app.addRepeat('${s.id}')">سجّل السحبة</button>
          <button class="btn ghost" onclick="app.cancelRepeat()">إلغاء</button>
        </div>`:''}
        ${upFor===s.id?`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
          <label class="f">المبلغ الجديد</label>
          <input class="f" type="text" inputmode="decimal" value="${esc(upDraft.amount)}" oninput="app.upSet('amount',numFix(this,1))">
          <label class="f">رجعلك كام من القديم؟</label>
          <input class="f" type="text" inputmode="decimal" value="${esc(upDraft.refund)}" oninput="app.upSet('refund',numFix(this,1))">
          <label class="f">رجعوا على أنهي حساب؟</label>
          ${payChips(upDraft.acct||s.account||'card','app.upAcct','','me')}
          <label class="f">من إمتى؟</label>
          ${dateField(upDraft.date,'app.upDate')}
          <div class="hint">هيتسجل استرداد بالسالب على تصنيف الاشتراك، ودفعة جديدة بالمبلغ الجديد، والتجديد الجاي بعد ${s.cycle==='yearly'?'سنة':'شهر'} من التاريخ ده.</div>
          <button class="btn" onclick="app.doUpgrade('${s.id}')">أكد الترقية</button>
          <button class="btn ghost" onclick="app.cancelUpgrade()">إلغاء</button>
        </div>`:''}
        ${editSub===s.id?`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
          <label class="f">اسم الاشتراك</label>
          <input class="f" value="${esc(sDraft.name)}" oninput="app.sdSet('name',this.value)">

          <label class="f">القيمة</label>
          <input class="f" type="text" inputmode="decimal" value="${esc(sDraft.amount)}" oninput="app.sdSet('amount',numFix(this,1))">
          <div class="chips" style="margin-top:10px">
            <button class="chip sm${sDraft.cur==='EGP'?' on':''}" onclick="app.sdPick('cur','EGP')">بالجنيه</button>
            <button class="chip sm${sDraft.cur==='USD'?' on':''}" onclick="app.sdPick('cur','USD')">بالدولار</button>
          </div>

          <label class="f">الدورة</label>
          <div class="chips">
            <button class="chip sm${sDraft.cycle==='monthly'?' on':''}" onclick="app.sdPick('cycle','monthly')">شهري</button>
            <button class="chip sm${sDraft.cycle==='yearly'?' on':''}" onclick="app.sdPick('cycle','yearly')">سنوي</button>
          </div>

          <label class="f">الخصم الجاي</label>
          <input class="f" type="date" value="${sDraft.next}" onchange="app.sdPick('next',this.value)">

          <label class="f">ساعة الخصم (اختياري)</label>
          <input class="f" type="time" value="${esc(sDraft.at||'')}" onchange="app.sdSetAt(this.value)">

          <label class="f">متقسم مع ناس؟</label>
          <div class="chips">
            <button class="chip sm${sDraft.split?'':' on'}" onclick="app.sdPick('split',false)">لأ، كله عليا</button>
            <button class="chip sm${sDraft.split?' on':''}" onclick="app.sdPick('split',true)">أيوه</button>
          </div>
          ${sDraft.split?`
            <label class="f">مين معاك وكل واحد بيدفع كام؟</label>
            ${sDraft.people.map((p,i)=>`<div style="display:grid;grid-template-columns:1fr 100px 34px;gap:8px;margin-bottom:8px">
              <input class="f" placeholder="الاسم" value="${esc(p.name)}" oninput="app.sdPerson(${i},'name',this.value)">
              <input class="f" type="text" inputmode="decimal" placeholder="المبلغ" value="${esc(p.amount)}" oninput="app.sdPerson(${i},'amount',numFix(this,1))">
              <button class="chip sm" style="padding:0" onclick="app.sdPersonDel(${i})">×</button>
            </div>`).join('')}
            <button class="btn ghost" style="margin-top:0" onclick="app.sdPersonAdd()">زوّد شخص</button>
            <div class="hint">نصيبك هيطلع <span class="n" id="sdshare">${fmt(Math.max(0,(Number(onlyNum(sDraft.amount))||0)-sDraft.people.reduce((a,p)=>a+(Number(onlyNum(p.amount))||0),0)))}</span> ${sDraft.cur==='USD'?'دولار':'جنيه'}.</div>`:''}

          <button class="btn" onclick="app.saveSubEdit('${s.id}')">احفظ التعديل</button>
          <button class="btn ghost" onclick="app.cancelSubEdit()">إلغاء</button>
        </div>`:''}
        ${paySubFor===s.id?`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
          <label class="f">دفعته إمتى؟</label>
          ${dateField(paySubDate,'app.setPaySubDate')}
          <button class="btn" onclick="app.confirmPaySub('${s.id}')">أكد دفع ${money(s.amount,s.cur)}</button>
          <button class="btn ghost" onclick="app.cancelPaySub()">إلغاء</button>
        </div>`:''}
        ${openDues(s).map(d=>`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px">
            <span>فلوس ليك${d.who?' عند '+esc(d.who):' عند الناس'} · دفعة ${dLabel(d.date)}</span>
            <span class="n" style="color:var(--mint);font-weight:600">${fmt(d.amount)}</span>
          </div>
          <div class="hint">استلمها من «محتاج انتباهك».</div>
        </div>`).join('')}
        ${convFor===s.id?`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
          <label class="f" style="margin-top:14px">هتجدد بعد التجربة؟</label>
          <div class="chips">
            <button class="chip sm${subDraft.willRenew?' on':''}" onclick="app.subPick('willRenew',true)">أيوه</button>
            <button class="chip sm${subDraft.willRenew?'':' on'}" onclick="app.subPick('willRenew',false)">لأ، هلغيها</button>
          </div>
          ${subDraft.willRenew?`
            <label class="f">قيمة الاشتراك</label>
            <input class="f" id="convamt" type="text" inputmode="decimal" value="${esc(subDraft.amount)}" oninput="app.subSet('amount',numFix(this,1))">
            <div class="chips" style="margin-top:10px">
              <button class="chip sm${subDraft.cur==='EGP'?' on':''}" onclick="app.subPick('cur','EGP')">بالجنيه</button>
              <button class="chip sm${subDraft.cur==='USD'?' on':''}" onclick="app.subPick('cur','USD')">بالدولار</button>
            </div>
            <label class="f">هيتجدد إزاي؟</label>
            <div class="chips">
              <button class="chip sm${subDraft.afterCycle==='monthly'?' on':''}" onclick="app.subPick('afterCycle','monthly')">شهري</button>
              <button class="chip sm${subDraft.afterCycle==='yearly'?' on':''}" onclick="app.subPick('afterCycle','yearly')">سنوي</button>
            </div>`:''}
          <label class="f">التجربة بتنتهي إمتى؟</label>
          <input class="f" type="date" value="${subDraft.next||s.next}" onchange="app.subPick('next',this.value)">
          <button class="btn" onclick="app.savePlan('${s.id}')">احفظ الخطة</button>
          <button class="btn ghost" onclick="app.cancelConv()">إلغاء</button>
        </div>`:''}
      </div>`}).join(''):'<div class="empty" style="padding:18px 10px">مفيش اشتراكات مسجلة.</div>'}

  </div>`;
}

function wIns(){
  const list=D.installments||[];
  const left=list.reduce((a,i)=>a+insLeft(i),0);
  const ok=insOk();
  return `<div style="margin-top:18px">
    <button class="btn ghost" style="margin:0 0 20px" onclick="app.toggleIns()">${showIns?'إلغاء':'زوّد قسط'}</button>
    ${showIns?`
      <label class="f">القسط ده إيه؟</label>
      <input class="f" value="${esc(insDraft.name)}" oninput="app.insSet('name',this.value)">
      <label class="f">مقسط على إيه؟ <b>*</b></label>
      <div class="chips">
        ${accountsFor('me').filter(a=>a.credit).map(a=>`<button class="chip sm${insDraft.src===a.id?' on':''}" onclick="app.insSrc('${a.id}')">${esc(a.name)}</button>`).join('')}
        <button class="chip sm${insDraft.src==='office'?' on':''}" onclick="app.insSrc('office')">سلفة</button>
      </div>
      ${isCreditAcc(insDraft.src)?`
      <label class="f">تاريخ الشراء</label>
      ${dateField(insDraft.buyDate||today(),'app.insBuyDate')}
      <label class="f">التصنيف</label>
      ${pickRow('inscat',D.cats.map(c=>({id:c.id,label:esc(c.label)})),insDraft.cat,'app.insCat')}
      <label class="f">المبلغ الأصلي</label>
      <input class="f" type="text" inputmode="decimal" value="${esc(insDraft.total)}" oninput="app.insSet('total',numFix(this,1))">
      <label class="f">عدد الشهور</label>
      <input class="f" type="text" inputmode="numeric" value="${esc(insDraft.months)}" oninput="app.insSet('months',numFix(this,0))">
      <label class="f">القسط الشهري</label>
      <input class="f" id="insmonthly" type="text" inputmode="decimal" value="${esc(insDraft.monthly)}" oninput="app.insSet('monthly',numFix(this,1))">
      <label class="f">النسبة الشهرية ٪</label>
      <input class="f" id="insrate" type="text" inputmode="decimal" value="${esc(insDraft.rate||'')}" oninput="app.insSet('rate',numFix(this,1))">
      <div class="hint">اكتب واحدة والتانية بتتحسب. لو القسط مكتوب قدامك اكتبه هو — النسبة اللي البنك بيعرضها متقرّبة. ونسبة صفر يعني من غير فايدة.</div>
      <div class="hint" id="inscalc">${insCalcHint()}</div>
      <div class="hint">الأصل كله هيتسجل على الكارت يوم الشراء، والفايدة بتتسجل لوحدها كل كشف وتأكدها من التنبيهات، والقسط بيتسدد مع الكارت.</div>
      `:`
      <label class="f">المبلغ الكامل</label>
      <input class="f" type="text" inputmode="decimal" value="${esc(insDraft.total)}" oninput="app.insSet('total',numFix(this,1))">
      <label class="f">قيمة القسط الشهري</label>
      <input class="f" type="text" inputmode="decimal" value="${esc(insDraft.monthly)}" oninput="app.insSet('monthly',numFix(this,1))">
      <label class="f">عدد الشهور كلها</label>
      <input class="f" type="text" inputmode="numeric" value="${esc(insDraft.months)}" oninput="app.insSet('months',numFix(this,0))">
      <label class="f">دفعت كام قسط لحد دلوقتي</label>
      <input class="f" type="text" inputmode="numeric" value="${esc(insDraft.paid)}" oninput="app.insSet('paid',numFix(this,0))">
      <label class="f">يوم الاستحقاق في الشهر</label>
      <input class="f" type="text" inputmode="numeric" value="${esc(insDraft.day)}" oninput="app.insSet('day',numFix(this,0))">
      ${(function(){const tt=Number(onlyNum(insDraft.total))||0,mo=Number(onlyNum(insDraft.monthly))||0,
          n=Number(onlyNum(insDraft.months))||0;
        if(!tt||!mo||!n)return '';
        const rest=Math.round((tt-mo*n)*100)/100;
        if(Math.abs(rest)<0.005)return '<div class="hint">الأقساط بتغطي المبلغ بالظبط.</div>';
        return rest>0
          ?`<div class="hint">فاضل <span class="n">${fmt(rest)}</span> هيتدفعوا في شهر زيادة بعد آخر قسط.</div>`
          :`<div class="hint">الأقساط أكبر من المبلغ بـ<span class="n">${fmt(-rest)}</span> — راجع الأرقام.</div>`;})()}

      <label class="f">القسط بيتدفع من أنهي حساب؟ <b>*</b></label>
      ${payChips(insDraft.account,'app.insAccount')}
      `}
      <button class="btn" id="inssave" ${ok?'':'disabled'} onclick="app.addIns()">احفظ القسط</button>
    `:''}
    ${list.length?`<div class="sec-h"><h3 style="font-size:14px">باقي عليك</h3><span class="n" style="font-size:15px">${fmt(left)}</span></div>`:''}
    ${list.length?list.map(i=>{
      const paid=Number(i.paid)||0,months=Number(i.months)||0,done=paid>=months;
      return `<div class="panel" id="pay-${i.id}" style="padding:15px 16px;margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
          <span style="font-family:var(--f-disp);font-size:14.5px;font-weight:600">${esc(i.name)}</span>
          <span class="n" style="font-size:15px;font-weight:600">${fmt(i.monthly)}</span>
        </div>
        <div class="track" style="margin:13px 0 9px"><div class="fill" style="width:${months?paid/months*100:0}%;background:#5C86C4"></div></div>
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--muted)">
          <span>دفعت <span class="n">${paid}</span> من <span class="n">${months}${insRest(i)>0?'+1':''}</span> · فاضل <span class="n">${fmt(insLeft(i))}</span>${insRest(i)>0?` · آخر شهر <span class="n">${fmt(insRest(i))}</span>`:''}</span>
          <span>${insWhen(i)}</span>
        </div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:6px">${insSrcLabel(i)}${insAhead(i)>0?` · مدفوع مقدم <span class="n">${insAhead(i)}</span> شهر`:''}</div>
        ${insLast(i)?`<div style="font-size:11.5px;color:var(--muted);margin-top:6px">آخر دفعة: ${dLabel(insLast(i).d)} · عن شهر ${mLabel(insLast(i).m)}</div>`:''}
        <div class="chips" style="margin-top:12px">
          ${done?'':(isCardIns(i)
            ?`<span class="hint" style="margin:0">بيتسدد مع مديونية ${esc(accName(i.src))}</span>`
            :`<button class="chip sm${insDue(i)?' on':''}" onclick="app.startPay('${i.id}','front')">${insDue(i)?'سدد':'ادفع مقدم —'} ${mLabel(insNextMonth(i))}</button>`)}
          ${(!done&&canPostpone(i))?`<button class="chip sm" onclick="app.postponeIns('${i.id}')">أجّل شهر</button>`:''}
          <button class="chip sm" onclick="app.startInsEdit('${i.id}')">${insEdit===i.id?'إخفاء':'عدّل'}</button>
          ${insLast(i)?`<button class="chip sm" onclick="app.undoIns('${i.id}')">تراجع آخر دفعة</button>`:''}
          ${delBtn('ins'+i.id,`app.delIns('${i.id}')`)}
        </div>
        ${insEdit===i.id?`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
          <label class="f" style="margin-top:0">الاسم</label>
          <input class="f" value="${esc(iDraft.name)}" oninput="app.iDraftSet('name',this.value)">
          <label class="f">المبلغ الكامل</label>
          <input class="f" type="text" inputmode="decimal" value="${esc(iDraft.total)}" oninput="app.iDraftSet('total',numFix(this,1))">
          <label class="f">القسط الشهري</label>
          <input class="f" type="text" inputmode="decimal" value="${esc(iDraft.monthly)}" oninput="app.iDraftSet('monthly',numFix(this,1))">
          <label class="f">عدد الشهور</label>
          <input class="f" type="text" inputmode="numeric" value="${esc(iDraft.months)}" oninput="app.iDraftSet('months',numFix(this,0))">
          <label class="f">يوم الاستحقاق</label>
          <input class="f" type="text" inputmode="numeric" value="${esc(iDraft.day)}" oninput="app.iDraftSet('day',numFix(this,0))">
          <label class="f">مقسط على إيه؟</label>
          <div class="chips">
            ${accountsFor('me').filter(a=>a.credit).map(a=>`<button class="chip sm${iDraft.src===a.id?' on':''}" onclick="app.iDraftPick('src','${a.id}')">${esc(a.name)}</button>`).join('')}
            ${officeOn()?`<button class="chip sm${iDraft.src==='office'?' on':''}" onclick="app.iDraftPick('src','office')">سلفة</button>`:''}
          </div>
          <label class="f">بيتدفع من أنهي حساب؟</label>
          ${payChips(iDraft.account,'app.iDraftAcct','','me')}
          <div class="hint">الدفعات اللي اتسجلت قبل كده هتفضل زي ما هي.</div>
          <button class="btn" onclick="app.saveInsEdit('${i.id}')">احفظ التعديل</button>

/* تطبيع النص للبحث: من غير فرق بين كابيتال وسمول، ولا أشكال الألف والتاء والياء، ولا تشكيل */
const normTxt=x=>String(x||'').toLowerCase()
  .replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
  .replace(/[\u064B-\u0652\u0640]/g,'');
const txnIn=t=>t.kind==='income'||t.kind==='float'||(t.kind==='settle'&&t.dir==='in');
function logList(){
  const list=D.txns.filter(t=>(t.book||'me')===book)
   .filter(t=>{
     if(!fDir)return true;
     if(t.kind==='yield')return false;
     const tr=t.kind==='transfer';
     if(fDir==='tr')return tr;
     if(tr)return false;
     return fDir==='in'?txnIn(t):!txnIn(t);
   })
   .filter(t=>!fMonth||monthOf(t.date)===fMonth)
   .filter(t=>!fAcct||t.account===fAcct||t.to===fAcct)
   .filter(t=>!fCat||(book==='office'?t.ocat===fCat:(t.cat===fCat||(t.items||[]).some(i=>i.cat===fCat))))
   .filter(t=>{
    const nq=normTxt(q).trim();
    if(!nq)return true;
    const hay=normTxt([t.note,t.merchant,t.item,t.place,t.date,catOf(t.cat).label,ocatOf(t.ocat).label].concat((t.items||[]).map(i=>i.name)).join(' '));
    return hay.indexOf(nq)>-1;});
  const sumLabel=fDir==='in'?'داخل':fDir==='tr'?'محوّل':'منصرف';
  const sum=list.reduce((a,t)=>{
    const v=Number(t.amount)||0;
    if(fDir==='in')return a+(txnIn(t)?v:0);
    if(fDir==='tr')return a+v;
    return a+(t.kind==='expense'?v:0);
  },0);
  return list.length
    ?`<div class="hint" style="margin:-6px 0 12px">${list.length} حركة · ${sumLabel} <span class="n">${fmt(sum)}</span></div>`+list.map(txnRow).join('')
    :'<div class="empty">مفيش نتايج.</div>';
}

/* --------------------------------------------------------------------------
   قفل الرسم أثناء اختيار تاريخ أو وقت
   منتقي التاريخ في الموبايل بيتقفل لو الصفحة اترسمت من تحته، فأي دالة
   بتنادي render وإحنا واقفين على خانة تاريخ أو وقت، الرسم بيتأجل لحد
   ما تسيب الخانة. ده بيشتغل تلقائيًا على أي خانة جديدة تتضاف بعد كده،
   من غير ما نعدّل الدوال نفسها.
   -------------------------------------------------------------------------- */
let renderLock=0, renderPending=false;
const isPickerEl=el=>{
  if(!el)return false;
  const t=String(el.type||'').toLowerCase();
  return t==='date'||t==='time'||t==='month'||t==='datetime-local'||t==='week';
};
if(document.addEventListener){
  document.addEventListener('focusin',e=>{if(isPickerEl(e.target))renderLock++;});
  document.addEventListener('focusout',e=>{
    if(!isPickerEl(e.target))return;
    renderLock=Math.max(0,renderLock-1);
    if(!renderLock&&renderPending){renderPending=false;render();}
  });
}
function unlockRender(){renderLock=0;if(renderPending){renderPending=false;render();}}

function render(){
  if(renderLock){renderPending=true;return;}
  if(!officeOn()&&book==='office')book='me';
  const bs=document.getElementById('bookseg');
  if(bs&&bs.style)bs.style.display=officeOn()?'':'none';
  if(document.body&&document.body.classList)document.body.classList.toggle('office',book==='office');
  document.querySelectorAll('.bookseg button').forEach(x=>x.classList.remove('on'));
  setText('bk-office',bookName());
  const bb=document.getElementById(book==='me'?'bk-me':'bk-office');
  if(bb)bb.classList.add('on');
  const lb=document.querySelector('header .lbl');
  if(lb)lb.textContent=book==='me'?'إجمالي اللي معاك':'رصيد العهدة';
  if(_svDay!==today()){_svDay=today();try{saveAccrueAll();}catch(e){}try{insuranceAll();}catch(e){}try{cardInsAll();}catch(e){}}
  const b=balances(book);
  const own=accountsFor(book).filter(a=>!a.credit&&!isSave(a));
  const vals=own.map(a=>Math.max(0,b[a.id]||0));
  const sum=vals.reduce((x,y)=>x+y,0);
  document.getElementById('total').textContent=fmt(own.reduce((x,a)=>x+(b[a.id]||0),0));
  document.getElementById('split').innerHTML= sum>0
    ? own.map((a,i)=>vals[i]>0?`<div style="width:${vals[i]/sum*100}%;background:${aColor(a.id)}"></div>`:'').join('')
    : '';
  const cr=book==='me'?accountsFor('me').filter(a=>a.credit):[];
  const cn=document.getElementById('creditnote');
  if(cn)cn.innerHTML=cr.length?('رصيد ائتماني متاح: <span class="n">'+fmt(cr.reduce((x,a)=>x+(b[a.id]||0),0))+'</span>'):'';
  const views={home:vHome,add:vAdd,scan:vScan,wallet:vWallet,log:vLog,settings:vSettings};
  const showWel=isFresh()&&!welSkipped&&tab!=='settings';
  document.getElementById('view').innerHTML=showWel?vWelcome():views[tab]();
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab===tab));
}

function useVoucher(id,total,date){
  if(!id)return null;
  const v=(D.vouchers||[]).find(x=>x.id===id);
  if(!v||v.used)return null;
  const used=Math.min(Number(v.amount)||0,total);
  if(used<=0)return null;
  v.used=true;v.usedOn=date||today();
  return {id:v.id,amount:Math.round(used*100)/100,code:v.code};
}
function refundVoucher(t){
  if(!t||!t.voucher)return;
  const v=(D.vouchers||[]).find(x=>x.id===t.voucher.id);
  if(v){v.used=false;v.usedOn='';}
}

const app={
  setBook(bk){book=bk;try{localStorage.setItem(BKEY,bk);}catch(e){}fMonth='';fCat='';fAcct='';fDir='';openRow={};alertsOpen=false;eTxn=null;tab='home';wtab=bk==='office'?'accounts':'accounts';confirmKey='';q='';render();window.scrollTo(0,0);},
  goClose(){tab='wallet';wtab='close';closeTo=today();render();window.scrollTo(0,0);},
  oSet(k,v){draftO[k]=v;setDisabled('osave',oOk());
    const el=document.getElementById('ominehint');
    if(el)el.textContent=fmt(Math.max(0,(Number(onlyNum(draftO.amount))||0)-(Number(onlyNum(draftO.mineAmt))||0)));},
  oKind(k){draftO.kind=k;render();},
  oAccount(id){draftO.account=id;render();},
  oCat(id){draftO.ocat=id;render();},
  oDir(d){draftO.dir=d;render();},
  oMine(v){draftO.mine=v;if(!v)draftO.mineAmt='';render();},
  oHasFee(v){draftO.hasFee=v;if(!v)draftO.feeAmt='';render();},
  oToMe(v){draftO.toMe=v;if(!v)draftO.to='';render();},
  oDiffTo(id){draftO.diffTo=id;render();},
  oDiffFrom(id){draftO.diffFrom=id;render();},
  oSetLive(k,v){
    draftO[k]=v;setDisabled('osave',oOk());
    const el=document.getElementById('ominehint');
    if(el)el.textContent=fmt(Math.max(0,(Number(onlyNum(draftO.amount))||0)-(Number(onlyNum(draftO.mineAmt))||0)));
    const ph=document.getElementById('opaidhint');
    if(ph){
      const a=Number(onlyNum(draftO.amount))||0, p=Number(onlyNum(draftO.paid))||0;
      ph.textContent=(!p||Math.abs(p-a)<0.005)
        ?'سيبها فاضية لو اللي خرج من العهدة هو نفس المصروف بالظبط.'
        :(p>a?'العهدة هيتسجل عليها '+fmt(p)+' في سطر واحد، و'+fmt(p-a)+' هيدخل رصيدك.'
             :'الفرق '+fmt(a-p)+' هيتحسب إنك دفعته من فلوسك، وهيبقى ليك في العهدة.');
    }
  },
  oItemPick(v){draftO.item=v;render();},
  oDate(v){draftO.date=v;render();},
  oTo(id){draftO.to=id;render();},
  oSave(){
    const amt=Number(onlyNum(draftO.amount))||0;
    if(amt<=0)return;
    if(draftO.kind!=='loan'&&!draftO.account)return;
    if(draftO.kind==='xfer'&&(!draftO.to||draftO.to===draftO.account))return;
    const it=normItem(draftO.item);
    if(draftO.kind==='xfer'){
      D.txns.unshift({id:uid(),book:'office',kind:'transfer',amount:amt,account:draftO.account,
        to:draftO.to,date:draftO.date,note:String(draftO.note||'').trim()||'تحويل عهدة'});
      sortTxns();save();
      draftO={kind:'expense',amount:'',account:'',to:'',item:'',ocat:'',date:today(),note:'',dir:'take',
        mine:false,mineAmt:'',place:'',hasFee:false,feeAmt:'',paid:'',diffTo:'cash',diffFrom:'',onote:'',toMe:false};
      render();window.scrollTo(0,0);app.toast('اتحول');return;
    }
    if(draftO.kind==='loan'){
      if(!D.floatLoans)D.floatLoans=[];
      D.floatLoans.push({id:uid(),dir:draftO.dir==='back'?'back':'take',amount:amt,
        date:draftO.date,note:String(draftO.note||'').trim()});
      save();
      draftO={kind:'expense',amount:'',account:'',to:'',item:'',ocat:'',date:today(),note:'',dir:'take',mine:false,mineAmt:'',place:'',hasFee:false,feeAmt:'',paid:'',diffTo:'cash',diffFrom:'',onote:'',toMe:false};
      render();window.scrollTo(0,0);app.toast('اتسجلت');return;
    }
    if(draftO.kind==='float'){
      D.txns.unshift({id:uid(),book:'office',kind:'float',amount:amt,account:draftO.account,
        date:draftO.date,note:String(draftO.note||'').trim()});
    }else{
      const paidOut=Number(onlyNum(draftO.paid))||0;
      const extra=paidOut>amt+0.005?Math.round((paidOut-amt)*100)/100:0;
      let mine=draftO.mine?(Number(onlyNum(draftO.mineAmt))||0):0;
      if(paidOut>0&&paidOut<amt-0.005)mine=Math.max(mine,Math.round((amt-paidOut)*100)/100);
      if(mine>amt)mine=amt;
      D.txns.unshift({id:uid(),book:'office',kind:'expense',amount:Math.round((amt+extra)*100)/100,
        account:draftO.account,date:draftO.date,item:it,ocat:draftO.ocat,
        note:String(draftO.onote||'').trim()||it,
        real:extra>0?amt:undefined,place:String(draftO.place||'').trim()||undefined});
      if(extra>0){
        D.txns.unshift({id:uid(),book:'me',kind:'income',amount:extra,
          account:draftO.diffTo||'cash',date:draftO.date,note:'باقي تقريب — '+it});
        /* كارت ائتماني: البنك خصم الفعلي بس، فالفرق بيتنقل جوه العهدة
           من الحساب اللي خدت منه الفرق للكارت — العهدة يفضل عليها المقفول */
        if(isCreditAcc(draftO.account)){

      if(L>0){

      }else{

      }

    if(eTxn.itemNames&&t.items){

        if(v&&t.items[ix])t.items[ix].name=v;

  confirmOwedGet(gid){

    if(!list.length||!owedAcct)return;
    const total=Math.round(list.reduce((a,x)=>a+Number(x.ref.amount),0)*100)/100;
    let got=Number(onlyNum(owedGot))||total;
    const key=String(gid).replace(/^g_/,'');
    const who=key==='__none__'?'':key;
    let lastCat='lentcat';
    list.forEach(x=>{
      if(got<=0.001)return;
      const o=x.ref;
      const take=Math.min(got,Number(o.amount)||0);
      if(take<=0.001)return;
      const cat=x.src==='due'?((x.sub&&x.sub.cat)||'subs'):(o.cat||'lentcat');
      lastCat=cat;
      const label=x.src==='due'?(x.sub?x.sub.name:''):(o.note||'');
      const t={id:uid(),book:'me',kind:'expense',amount:-take,cat:cat,account:owedAcct,
        date:today(),note:'تحصيل'+(who?' من '+who:'')+(label?' — '+label:'')};
      D.txns.unshift(t);
      o.got=true;o.gotOn=today();o.gotAmount=take;o.gotTxns=[t.id];
      got=Math.round((got-take)*100)/100;

  saveEntry(){

      if(amt<=0)return;
      const dest=draft.to2||'cash';

        date:draft.date,note:'سحب من مكنة فودافون كاش'});

        account:'vcash',date:draft.date,note:'عمولة سحب فودافون كاش'});

      render();window.scrollTo(0,0);app.toast('اتسجل السحب');return;
    }
    if(draft.kind!=='transfer'&&saveAcc(draft.account)){app.toast('ده وعاء ادخار — حوّل منه الأول');return;}
    const usd=draft.cur==='USD'?amt:0;
    let disc=(draft.kind==='expense'&&draft.hasDisc&&!usd)?(Number(onlyNum(draft.discAmt))||0):0;
    if(disc>amt)disc=amt;
    const net=Math.round((amt-disc)*100)/100;
    let fromFloat=(draft.kind==='expense'&&draft.fromFloat&&!usd)?(Number(onlyNum(draft.floatAmt))||0):0;
    if(fromFloat>net)fromFloat=net;
    const hold=usd?(Number(onlyNum(draft.hold))||0):0;
    const gross=usd?(hold>0?hold:Math.round(usd*D.rate*100)/100):(net-fromFloat);
    const vch=useVoucher(draft.kind==='expense'&&!usd?draft.voucherId:'',gross,draft.date);
    const isLent=draft.kind==='expense'&&draft.owed&&draft.owedKind==='lent';
    const srcTxnId=uid();
    const finalAmt=Math.round((gross-(vch?vch.amount:0))*100)/100;
    const isFuel=(draft.cat==='fuel'&&!!draft.veh);
    const litersIn=isFuel?(Number(onlyNum(draft.liters))||0):0;
    const fPrice=isFuel?fuelPrice(draft.fuelType):0;
    const litersAuto=(isFuel&&!litersIn&&fPrice>0&&finalAmt>0)?Math.round(finalAmt/fPrice*100)/100:0;
    D.txns.unshift({id:srcTxnId,book:'me',kind:draft.kind,amount:finalAmt,
      cat:isLent?'lentcat':draft.cat,account:draft.account,to:draft.kind==='transfer'?draft.to:null,

  async pasteImage(){
    try{
      if(!navigator.clipboard||!navigator.clipboard.read){
        scan.err='المتصفح ده مش بيسمح باللصق. اختار الصورة من فوق.';render();return;
      }
      const items=await navigator.clipboard.read();
      for(const it of items){
        const type=(it.types||[]).find(t=>t.indexOf('image/')===0);
        if(type){
          const blob=await it.getType(type);
          return app.pickFile({files:[new File([blob],'pasted.png',{type:type})],value:''});
        }
      }
      scan.err='مفيش صورة في الحافظة.';render();
    }catch(e){
      scan.err='مقدرتش أوصل للحافظة. اختار الصورة من فوق.';render();
    }
  },
  async pickFile(el){
    const f=el.files&&el.files[0];el.value='';
    if(!f)return;
    scan.err='';scan.stage='working';render();
    try{
      const r=await readReceipt(await shrink(f));
      const items=(r.items||[]).map(i=>({name:String(i.name||'صنف'),amount:Number(i.amount)||0,cat:catOf(i.cat).id}));
      if(!items.length)throw new Error('empty');
      scan.items=items;scan.merchant=r.merchant||'';scan.account='';
      scan.date=(r.date&&/^\d{4}-\d{2}-\d{2}$/.test(r.date))?r.date:today();
      scan.stage='review';
    }catch(e){
      const m=String(e.message||'');
      scan.err=(m.indexOf('credit')>-1||m.indexOf('balance')>-1)?'الحساب مفيهوش رصيد كفاية على منصة أنثروبيك.'
        :(m.indexOf('authentication')>-1||m.indexOf('x-api-key')>-1||m.indexOf('invalid')>-1)?'المفتاح غلط أو ناقص. راجعه من الإعدادات.'
        :'مقدرتش أقرا الفاتورة. جرب صورة أوضح وواقفة، أو سجّل المبلغ يدوي من تبويب الإضافة.';

  toggleSms(){sms={open:!sms.open,text:'',busy:false,err:'',ops:[]};render();},
  smsSet(v){sms.text=v;},
  async readSmsNow(){
    const el=document.getElementById('smsbox');
    const txt=(el?String(el.value||''):sms.text).trim();
    if(!txt){sms.err='الزق الرسالة الأول.';render();return;}
    if(!getKey()){sms.err='محتاج تحط مفتاح قراءة الفواتير من الإعدادات.';render();return;}
    sms.busy=true;sms.err='';render();
    try{
      const r=await readSms(txt);
      const ops=(r.ops||[]).filter(o=>Number(o.amount)>0);
      if(!ops.length)throw new Error('مالقتش عمليات في الرسالة.');
      let n=0;
      ops.forEach(o=>{
        const acc=D.accounts.find(a=>a.id===o.account)?o.account:'';
        const dt=/^\d{4}-\d{2}-\d{2}$/.test(o.date||'')?o.date:today();
        const amt=Math.round(Number(o.amount)*100)/100;
        const place=String(o.place||'').trim();
        if(o.kind==='income'){
          D.txns.unshift({id:uid(),book:'me',kind:'income',amount:amt,account:acc,date:dt,
            note:place||String(o.note||'').trim()||'إيداع',fromSms:true,needs:!acc});
        }else if(o.kind==='transfer'){
          D.txns.unshift({id:uid(),book:'me',kind:'transfer',amount:amt,account:acc,
            to:(D.accounts.find(a=>a.id===o.to)?o.to:''),date:dt,note:place||'تحويل',fromSms:true,needs:!acc});
        }else{
          D.txns.unshift({id:uid(),book:'me',kind:'expense',amount:amt,cat:'other',account:acc,date:dt,
            note:place||String(o.note||'').trim()||'خصم',place:place||undefined,fromSms:true,needs:true});
        }
        n++;
      });
      sms={open:false,text:'',busy:false,err:'',ops:[]};
      sortTxns();save();render();window.scrollTo(0,0);
      app.toast('اتسجل '+n+(n===1?' خصم':' عمليات'));
    }catch(e){
      sms.busy=false;
      sms.err=String(e.message||e).indexOf('credit')>-1?'رصيد المفتاح خلص.':('مقدرتش أقراها: '+(e.message||''));
      render();
    }
  },

  scanAccount(id){scan.account=id;render();},
  saveReceipt(){
    const items=scan.items||[];
    const offItems=items.filter(i=>i.off);
    const whoItems=items.filter(i=>!i.off&&i.who);
    const mineItems=items.filter(i=>!i.off&&!i.who);
    const sum=a=>Math.round(a.reduce((x,i)=>x+(Number(i.amount)||0),0)*100)/100;
    const rawTotal=sum(items);
    const sdisc=Math.min(rawTotal,Number(onlyNum(scan.disc||''))||0);

    if(book==='office'){
      const oit=normItem(scan.item||scan.merchant||'فاتورة');
      D.txns.unshift({id:uid(),book:'office',kind:'expense',amount:Math.max(0,rawTotal-sdisc),
        account:scan.account,date:scan.date,item:oit,ocat:scan.ocat,note:oit,
        discount:sdisc||undefined,place:scan.merchant||undefined,items:items});
      sortTxns();save();
      scan={stage:'idle',items:[],merchant:'',date:today(),account:'',err:'',voucherId:'',voucherAmt:'',
        oitem:'',ocat:'',disc:'',split:false,people:[{name:'',amount:''}]};
      ownerFor=null;render();window.scrollTo(0,0);app.toast('اتحفظت');return;
    }

    if(offItems.length){
      const oit=normItem(scan.oitem||scan.merchant||'فاتورة');
      D.txns.unshift({id:uid(),book:'office',kind:'expense',amount:sum(offItems),account:scan.account,
        date:scan.date,item:oit,ocat:scan.ocat,note:oit,place:scan.merchant||undefined,
        items:offItems.map(i=>({name:i.name,amount:i.amount,cat:i.cat}))});
    }

    if(needsTxn){
      const t=D.txns.find(x=>x.id===needsTxn);
      if(t){
        const items=items0=>0;
        const all=(scan.items||[]).map(i=>({name:i.name,amount:Number(i.amount)||0,cat:i.cat}));
        const s=Math.round(all.reduce((a,i)=>a+i.amount,0)*100)/100;
        t.items=all;t.cat=(all[0]&&all[0].cat)||t.cat;
        t.merchant=scan.merchant||t.merchant;
        t.place=scan.merchant||t.place;
        t.needsDiff=(Math.abs(s-Number(t.amount))>0.005)?s:undefined;
        t.needs=undefined;
        needsTxn=null;
        sortTxns();save();
        scan={stage:'idle',items:[],merchant:'',date:today(),account:'',err:'',voucherId:'',voucherAmt:'',
          oitem:'',ocat:'',disc:'',split:false,people:[{name:'',amount:''}]};
        render();window.scrollTo(0,0);
        app.toast(t.needsDiff?'اتسجلت — فيه فرق راجعه':'اتسجلت');
        return;
      }
      needsTxn=null;
    }
    const myItems=mineItems.concat(whoItems);
    const myTotalRaw=sum(myItems);
    const myTotal=Math.max(0,Math.round((myTotalRaw-sdisc)*100)/100);
    if(myItems.length||sdisc>0){
      const vch=useVoucher(scan.voucherId,myTotal,scan.date);
      const txnId=uid();
      D.txns.unshift({id:txnId,book:'me',kind:'expense',
        amount:Math.round((myTotal-(vch?vch.amount:0))*100)/100,
        cat:(mineItems[0]&&mineItems[0].cat)||'other',
        account:scan.account,date:scan.date,merchant:scan.merchant,note:scan.merchant,
        place:scan.merchant||undefined,discount:sdisc||undefined,
        items:myItems,voucher:vch||undefined});

      if(!D.owed)D.owed=[];
      const byWho={};
      whoItems.forEach(i=>{const n=String(i.who).trim();
        byWho[n]=Math.round(((byWho[n]||0)+(Number(i.amount)||0))*100)/100;});
      Object.keys(byWho).forEach(n=>{
        D.owed.push({id:uid(),amount:byWho[n],who:n,date:scan.date,
          note:(scan.merchant||'فاتورة'),cat:'lentcat',srcTxn:txnId,got:false,lent:true});
      });
      if(scan.split)(scan.people||[]).forEach(p=>{
        const amt=Number(onlyNum(p.amount))||0;
        if(amt>0)D.owed.push({id:uid(),amount:amt,who:String(p.name||'').trim(),date:scan.date,
          note:(scan.merchant||'فاتورة'),cat:(mineItems[0]&&mineItems[0].cat)||'other',
          srcTxn:txnId,got:false});
      });
    }

    sortTxns();save();
    scan={stage:'idle',items:[],merchant:'',date:today(),account:'',err:'',voucherId:'',voucherAmt:'',
      oitem:'',ocat:'',disc:'',split:false,people:[{name:'',amount:''}]};
    ownerFor=null;
    render();window.scrollTo(0,0);app.toast('اتحفظت');
  },

    if(cn+inn+sn>0){
      const parts=[];

      if(inn)parts.push(inn+' قسط');

      render();return;
    }
    const gone=D.txns.filter(t=>t.account===id||t.to===id);
    const links=gone.filter(t=>t.link).map(t=>t.link);
    gone.forEach(refundVoucher);
    D.txns.filter(t=>t.link&&links.indexOf(t.link)>-1).forEach(refundVoucher);
    D.accounts=D.accounts.filter(a=>a.id!==id);
    D.txns=D.txns.filter(t=>!(t.account===id||t.to===id)&&!(t.link&&links.indexOf(t.link)>-1));

  toggleRefundPart(accId,need){
    if(refundParts[accId]!==undefined){delete refundParts[accId];}
    else{
      const ob=balances('office')[accId]||0;
      const left=Math.max(0,Math.round((need-refundTotal())*100)/100);
      refundParts[accId]=String(Math.min(ob,left||ob));

  setRefundPart(accId,v){

    setText('refsum',fmt(refundTotal()));
  },
  cancelRefund(){refundFor=null;refundParts={};render();},
  setRefundTo(id){refundTo=id;render();},
  doRefund(accId,need){
    if(!refundTo||refundTotal()<=0)return;
    const owed=Number(need)||0;
    let left=Math.min(refundTotal(),owed);
    Object.keys(refundParts).forEach(src=>{
      const amt=Number(onlyNum(refundParts[src]))||0;
      if(amt<=0)return;
      // كل اللي خرج من العهدة بيتحرك من مصدر العهدة للحساب اللي دفعت منه
      D.txns.unshift({id:uid(),book:'office',kind:'transfer',amount:amt,
        account:src,to:accId,date:today(),note:'استرداد اللي دفعته من فلوسي'});
      // اللي بيقفل المستحق بس هو اللي بيرجع لحسابك
      const cover=Math.min(amt,left);
      left=Math.round((left-cover)*100)/100;
      if(cover>0.005)D.txns.unshift({id:uid(),book:'me',kind:'transfer',amount:cover,
        account:accId,to:refundTo,date:today(),note:'استرداد من العهدة'});
      // الزيادة: بتتزود على نفس بند المصروف وتدخل رصيدك
      const over=Math.round((amt-cover)*100)/100;
      if(over>0.005){
        const target=D.txns.find(t=>t.book==='office'&&t.kind==='expense'&&t.account===accId);
        if(target){
          target.real=target.real||target.amount;
          target.amount=Math.round((Number(target.amount)+over)*100)/100;
        }else{
          D.txns.unshift({id:uid(),book:'office',kind:'expense',amount:over,account:accId,
            date:today(),item:'تقريب',ocat:defOcat(),note:'تقريب'});
        }
        D.txns.unshift({id:uid(),book:'me',kind:'income',amount:over,account:refundTo,
          date:today(),note:'باقي تقريب من العهدة'});
      }
    });
    refundFor=null;refundParts={};refundTo='';sortTxns();save();render();app.toast('اتسجل');
  },

    const usd=s.cur==='USD'?Number(s.amount):0;
    const full=usd?Math.round(usd*D.rate*100)/100:Number(s.amount);
    const t={id:uid(),book:'me',kind:'expense',amount:full,
      cat:s.cat||'subs',account:s.account||'card',date:paySubDate,note:s.name,
      usd:usd||undefined,rate:usd?D.rate:undefined,pending:usd?true:undefined};
    D.txns.unshift(t);
    if(!s.payments)s.payments=[];
    const pay={d:paySubDate,t:t.id,paid:full};
    if(s.cur!=='USD'){
      const est=Math.round(full*0.03*100)/100;
      if(est>0){pay.fee=est;pay.feePending=true;}
    }
    s.payments.push(pay);
    if(subShared(s)){
      if(!s.dues)s.dues=[];
      const ppl=subPeople(s);
      if(ppl.length){
        ppl.forEach(p=>{
          const amt=usd?Math.round(Number(p.amount)*D.rate*100)/100:Number(p.amount);
          if(amt>0.01)s.dues.push({id:uid(),who:p.name,amount:amt,date:paySubDate,got:false,srcTxn:t.id});
        });
      }else{
        const mineEgp=usd?Math.round(subMine(s)*D.rate*100)/100:subMine(s);
        const owed=Math.round((full-mineEgp)*100)/100;
        if(owed>0.01)s.dues.push({id:uid(),amount:owed,date:paySubDate,got:false,srcTxn:t.id});

  },
  grpAddItem(id){const g=(D.groups||[]).find(x=>x.id===id);if(!g)return;
    if(!g.items)g.items=[];g.items.push('');save();render();},
  grpAddNamed(id,name){const g=(D.groups||[]).find(x=>x.id===id);if(!g)return;
    const own=groupOwning(name,id);
    if(own){alert('«'+name+'» موجود في مجموعة «'+own.name+'».');return;}
    if(!g.items)g.items=[];
    if(g.items.map(x=>normItem(x)).indexOf(normItem(name))<0)g.items.push(name);
    save();render();},
  grpDelItem(id,ix){const g=(D.groups||[]).find(x=>x.id===id);if(!g||!g.items)return;
    g.items.splice(ix,1);save();render();},
  saveGroup(id){
    const g=(D.groups||[]).find(x=>x.id===id);if(!g)return;
    g.name=String(g.name||'').trim()||'مجموعة';
    g.items=(g.items||[]).map(x=>String(x||'').trim()).filter(Boolean);
    const dup=g.items.find(it=>groupOwning(it,id));
    if(dup){
      const own=groupOwning(dup,id);
      alert('«'+dup+'» موجود في مجموعة «'+own.name+'». شيله من واحدة منهم الأول.');
      render();return;
    }
    // امنع تكرار نفس البند جوه نفس المجموعة
    const seen=[];
    g.items=g.items.filter(it=>{const n=normItem(it);
      if(seen.indexOf(n)>-1)return false;seen.push(n);return true;});
    grpEdit=null;save();render();app.toast('اتحفظت');
  },
  delGroup(id){
    D.groups=(D.groups||[]).filter(g=>g.id!==id);
    grpEdit=null;confirmKey='';save();render();
  },
  wipeOffice(){
    const b=balances('office');
    if(D.accounts.some(a=>Math.abs(b[a.id]||0)>0.01)||Math.abs(loanBalance())>0.01||ofeeBalance()>0.01){
      confirmKey='';render();return;
    }
    const ids=D.txns.filter(t=>t.book==='office').map(t=>t.id);
    const links=D.txns.filter(t=>t.book==='office'&&t.link).map(t=>t.link);
    D.txns=D.txns.filter(t=>t.book!=='office'&&!(t.link&&links.indexOf(t.link)>-1));
    D.closings=[];D.floatLoans=[];D.ofees=[];D.lastClose='';
    D.accounts.forEach(a=>{a.openingOffice=0;});
    D.installments=(D.installments||[]).filter(i=>i.src!=='office');
    confirmKey='';save();render();app.toast('اتمسحت');
  },
  setOfficeOn(v){
    if(!v&&hasOfficeData()){
      alert('فيه بيانات مكتب مسجلة. امسحها الأول لو عايز تقفل الدفتر.');
      return;
    }
    D.officeOn=!!v;
    if(!v){book='me';try{localStorage.setItem(BKEY,'me');}catch(e){}}
    save();render();
  },
  setMonthMode(m){D.monthMode=m;month='';save();render();},
  saveOfeeLimit(){
    const v=numVal('ofeelim');
    if(v>0){D.ofeeLimit=v;save();app.toast('اتحفظ');}
    render();
  },
  saveBookName(){
    const el=document.getElementById('bknamein');
    D.bookName=el?String(el.value||'').trim().slice(0,24):'';
    save();app.toast('اتحفظ');render();
  },
  saveRate(){
    const v=numVal('ratein');
    if(v>0){D.rate=v;save();app.toast('اتحفظ');}
    render();
  },
  saveFuelPrices(){
    D.p92=numVal('p92in')||0;
    D.p95=numVal('p95in')||0;
    save();app.toast('اتحفظ');render();
  },
  toggleSet(k){setsOpen[k]=!setsOpen[k];render();},
  toggleAlerts(){alertsOpen=!alertsOpen;render();},
  svSet(sc,k,v,rr){const o=sc==='new'?accDraft:svEdit;if(!o)return;
    /* لو الطريقة اتغيرت في التعديل، النسبة تتمسح عشان تتكتب الجديدة */
    if(sc==='edit'&&k==='saveFreq'&&v!==o.saveFreq){o.saveRate=(v===o._freq0)?(o._rate0?String(o._rate0):''):'';}
    o[k]=v;if(rr)render();},
  saveSaveCfg(id){const a=saveAcc(id);if(!a||!svEdit)return;applySaveCfg(a,svEdit);svEdit=null;save();app.toast('اتحفظ');render();},
  saveWithdrawGo(id){
    tab='add';openRow={};draft.kind='transfer';draft.account=id;draft.to='';draft.cur='EGP';
    render();window.scrollTo(0,0);
  },
  saveWithdrawDone(id){const a=saveAcc(id);if(!a)return;delete a.saveWithdraw;save();render();},
  openRow(k){if(k)openRow[k]='open';render();},
  shutRow(k){if(k)openRow[k]='shut';},
  toggleGhHelp(){showGhHelp=!showGhHelp;render();},
  ghConnect(){return ghConnect();},
  ghSyncNow(){return ghReconcile();},
  ghDisconnect(){
    ghToken='';ghGist='';
    try{localStorage.removeItem(GKEY);localStorage.removeItem(GIDKEY);}catch(e){}
    confirmKey='';ghState={busy:false,msg:''};render();
  },
  editKey(){showKeyEdit=true;confirmKey='';render();},
  cancelKeyEdit(){showKeyEdit=false;render();},
  clearKey(){
    try{localStorage.removeItem(AKEY);}catch(e){}
    confirmKey='';showKeyEdit=false;render();
  },
  saveKey(){
    const el=document.getElementById('keyin');
    const v=el?el.value.trim():'';
    if(!v){msg='';render();return;}
    try{localStorage.setItem(AKEY,v);app.toast('اتحفظ');}
    catch(e){msg='مقدرتش أحفظ المفتاح.';}
    showKeyEdit=false;render();
  },
  async exportData(){
    const txt=JSON.stringify(D,null,2);
    const name='masareef-'+today()+'.json';
    D.lastBackup=today();save();
    try{
      const file=new File([txt],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:name});
        render();return;
      }
    }catch(e){}
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
    a.download=name;a.click();
    render();app.toast('اتحفظت نسخة');
  },
  importData(el){
    const f=el.files&&el.files[0];el.value='';if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);
      if(d.accounts&&d.txns){D=d;load();save();msg='البيانات رجعت.';render();}else alert('الملف مش سليم.');}
      catch(e){alert('الملف مش سليم.');}};
    r.readAsText(f);
  },
  wipe(){
    try{localStorage.removeItem(SKEY);}catch(e){}
    D=JSON.parse(JSON.stringify(DEFAULT));
    D.certs=[];D.subs=[];D.installments=[];D.vouchers=[];D.closings=[];
    D.cats=JSON.parse(JSON.stringify(DEF_CATS));D.lastClose='';D.lastBackup='';
    load();confirmKey='';save();tab='home';book='me';render();
  }
};

if(navigator.storage&&navigator.storage.persist){
  navigator.storage.persisted().then(p=>{if(!p)navigator.storage.persist().catch(()=>{});}).catch(()=>{});
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
load();
sortTxns();

if(D._needSort){delete D._needSort;save();}
if(ghToken&&ghGist){ghLastPull=Date.now();ghReconcile();}
if(document.addEventListener)document.addEventListener('paste',e=>{
  if(tab!=='scan'||scan.stage==='working')return;
  const items=(e.clipboardData&&e.clipboardData.items)||[];
  for(let i=0;i<items.length;i++){
    if(items[i].type&&items[i].type.indexOf('image/')===0){
      const f=items[i].getAsFile();
      if(f){e.preventDefault();app.pickFile({files:[f],value:''});return;}
    }
  }
});
if(document.addEventListener)document.addEventListener('visibilitychange',()=>{if(!document.hidden)ghMaybePull();});
(function(){
  const cu=catchUp();
  const parts=[];
  if(cu.n)parts.push('اتقيد '+cu.n+' دفعة عوائد بإجمالي '+fmt(cu.tot)+' جنيه على حسابك.');
  const tr=autoTrials();
  if(tr.length)parts.push('خلصت تجربة '+tr.join(' و')+' واتحولت لاشتراك زي ما ظبطت.');
  autoMsg=parts.join(' ');
})();
render();
</script>
</body>
