<style>

:root{
  --bg:#101318; --surf:#191D23; --surf2:#212630; --line:#2B313A;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);margin:0;padding:0;}
body{font-family:var(--f-body);color:var(--text);-webkit-font-smoothing:antialiased;}
#app{background:var(--bg);min-height:100vh;min-height:100dvh;
     padding-bottom:calc(104px + (env(safe-area-inset-bottom) * 0.3));overflow-x:hidden;}
h1,h2,h3,.disp{font-family:var(--f-disp);font-weight:600;letter-spacing:0;}
.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;display:inline-block;}
button{font-family:inherit;}

/* ---------- الهيدر ---------- */
header{padding:calc(34px + env(safe-area-inset-top)) 18px 0;
       display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.lbl{font-size:12px;color:var(--muted);font-weight:500;}
.hero{font-family:var(--f-disp);font-size:42px;font-weight:700;line-height:1.05;margin-top:6px;}
.hero em{font-style:normal;font-size:14px;color:var(--muted);font-family:var(--f-body);
         font-weight:400;margin-inline-start:8px;}
.gear{background:var(--surf);border:1px solid var(--line);color:var(--muted);border-radius:12px;
      width:40px;height:40px;flex:none;cursor:pointer;display:grid;place-items:center;}

/* ---------- شريط توزيع الفلوس ---------- */
.split{display:flex;gap:3px;height:10px;margin:18px 18px 0;border-radius:99px;overflow:hidden;
       background:var(--surf2);}
.split div{height:100%;}
.wrap{padding:0 18px;}

/* ---------- عناصر عامة ---------- */
.sec{margin-top:30px;}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.sec-h h3{margin:0;font-size:16px;}
.sec-h span{font-size:12px;color:var(--muted);}

.panel{background:var(--surf);border:1px solid var(--line);border-radius:20px;overflow:hidden;}
.arow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);}
.arow:last-child{border-bottom:0;}
.rail{width:4px;height:26px;border-radius:99px;flex:none;}
.arow .nm{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.arow .vl{font-family:var(--f-num);font-size:15px;font-weight:600;direction:ltr;}

.stats{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:20px;}
.stat{flex:1;padding:16px 10px;text-align:center;border-inline-end:1px solid var(--line);}
.stat:last-child{border-inline-end:0;}
.stat b{display:block;font-family:var(--f-num);font-size:19px;font-weight:600;direction:ltr;margin-bottom:4px;}
.stat span{font-size:11.5px;color:var(--muted);}

.mpills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
.mpills::-webkit-scrollbar{display:none;}
.mpill{flex:none;background:var(--surf);border:1px solid var(--line);color:var(--muted);
  border-radius:99px;padding:8px 14px;font-size:12.5px;font-family:var(--f-num);cursor:pointer;}
.mpill.on{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:600;}

.cat{margin-bottom:16px;}
.cat-t{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:7px;gap:10px;}
.cat-t .r{display:flex;gap:8px;align-items:baseline;flex:none;}
.cat-t .pc{font-size:11px;color:var(--muted);font-family:var(--f-num);}
.cat-t .am{font-family:var(--f-num);font-size:13.5px;font-weight:600;direction:ltr;}
.track{height:6px;background:var(--surf2);border-radius:99px;overflow:hidden;}
.fill{height:100%;border-radius:99px;transition:width .45s cubic-bezier(.2,.7,.3,1);}

.tx{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surf);
    border:1px solid var(--line);border-radius:16px;margin-bottom:9px;cursor:pointer;}
.tx .ic{width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;
        font-size:15px;font-family:var(--f-disp);font-weight:600;}
.tx .g{flex:1;min-width:0;}
.tx .t{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx .s{font-size:11px;color:var(--muted);margin-top:3px;}
.tx .a{font-family:var(--f-num);font-size:14.5px;font-weight:600;white-space:nowrap;direction:ltr;}
.detail{margin:-3px 0 12px;padding:2px 14px 0;}
.detail .d{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:6px 0;
  color:#BFC7D1;border-bottom:1px dashed var(--line);}
.detail .d:last-of-type{border-bottom:0;}

/* ---------- فورم ---------- */
label.f{display:block;font-size:12.5px;color:var(--muted);margin:22px 0 9px;font-weight:500;}
label.f b{color:var(--accent);}
input.f,select.f{width:100%;max-width:100%;min-width:0;background:var(--surf);border:1px solid var(--line);
  border-radius:14px;padding:14px;color:var(--text);font:inherit;font-size:15px;
  -webkit-appearance:none;appearance:none;}
input.f:focus{outline:2px solid var(--accent);outline-offset:1px;}
input[type=date].f{direction:ltr;text-align:center;font-family:var(--f-num);font-size:14px;
  display:block;height:50px;line-height:normal;}
input[type=date].f::-webkit-date-and-time-value{text-align:center;margin:0;}
.money{position:relative;margin-top:6px;}
.money input{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:20px;
  padding:26px 60px 26px 20px;color:var(--text);font-family:var(--f-num);font-size:36px;
  font-weight:600;text-align:center;direction:ltr;-webkit-appearance:none;appearance:none;}
.money input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.money span{position:absolute;inset-inline-end:22px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:13px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{border:1px solid var(--line);background:var(--surf);color:#D2D8E0;border-radius:14px;
  padding:11px 15px;font:inherit;font-size:13px;cursor:pointer;transition:.15s;}
.chip.on{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600;}
.chip.sm{padding:7px 12px;font-size:12px;border-radius:11px;}
.seg{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:5px;gap:5px;}
.seg button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;
  padding:11px 4px;border-radius:12px;cursor:pointer;}
.seg button.on{background:var(--accent);color:var(--on);font-weight:600;}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font:inherit;font-size:15px;font-weight:600;
  cursor:pointer;background:var(--accent);color:var(--on);margin-top:24px;}
.btn.ghost{background:transparent;border:1px solid var(--line);color:#D2D8E0;margin-top:10px;font-weight:500;}
.btn.danger{background:transparent;border:1px solid #4A2E2B;color:#FF9C90;margin-top:10px;font-weight:500;}
.btn:disabled{opacity:.4;}
.hint{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.7;}

/* ---------- الفاتورة الورقية ---------- */
.receipt{background:var(--paper);color:var(--paper-ink);border-radius:8px 8px 0 0;
  padding:20px 16px 14px;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.45);}
.receipt::after{content:"";position:absolute;inset-inline:0;bottom:-10px;height:10px;
  background-image:linear-gradient(45deg,transparent 50%,var(--bg) 50%),
                   linear-gradient(-45deg,transparent 50%,var(--bg) 50%);
  background-size:16px 10px;background-repeat:repeat-x;}
.rh{text-align:center;border-bottom:1px dashed #B9B3A6;padding-bottom:12px;margin-bottom:6px;}
.rh b{font-family:var(--f-disp);font-size:16px;font-weight:600;}
.rh div{font-size:11px;color:#6E6759;margin-top:4px;font-family:var(--f-num);direction:ltr;}
.rl{display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px dotted #CDC7B8;}
.rl input,.rl select{background:transparent;border:0;font-family:var(--f-body);color:var(--paper-ink);padding:2px;min-width:0;}
.rl input.nm{flex:1;font-size:13.5px;}
.rl input.vl{width:74px;text-align:end;font-family:var(--f-num);font-weight:600;font-size:13.5px;direction:ltr;}
.rl select{font-size:10.5px;color:#6E6759;max-width:94px;}
.rl .x{background:none;border:0;color:#A9391F;font-size:17px;cursor:pointer;padding:0 3px;line-height:1;}
.rt{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;margin-top:6px;
  border-top:1px dashed #B9B3A6;font-weight:600;font-size:16px;font-family:var(--f-disp);}
.rt span:last-child{font-family:var(--f-num);direction:ltr;}

.drop{border:1.5px dashed var(--line);border-radius:22px;padding:44px 20px;text-align:center;
  background:var(--surf);cursor:pointer;}
.drop p{margin:14px 0 6px;font-size:15px;font-family:var(--f-disp);font-weight:600;}
.drop small{color:var(--muted);font-size:12px;line-height:1.7;display:block;}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:36px 12px;line-height:1.9;}
.note{padding:13px 15px;border-radius:14px;font-size:12.5px;line-height:1.75;margin-top:16px;}
.note.err{background:#2A1D1C;border:1px solid #4A2E2B;color:#FFC0B7;}
.note.warn{background:#26241A;border:1px solid #4A452C;color:#EDD9A6;}
.note.ok{background:#152A22;border:1px solid #2F5A47;color:#A9E3CD;}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);
  border-radius:99px;animation:sp .8s linear infinite;margin:0 auto;}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}.fill{transition:none}}
.steps{font-size:13px;color:#C6CDD6;line-height:2;padding-inline-start:18px;margin:10px 0 0;}

/* ---------- النافبار ---------- */
nav{position:fixed;bottom:calc(14px + (env(safe-area-inset-bottom) * 0.3));inset-inline:15px;
  background:rgba(25,29,35,.94);backdrop-filter:blur(16px);border:1px solid var(--line);
  border-radius:24px;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px;
  box-shadow:0 14px 36px rgba(0,0,0,.55);z-index:40;}
nav button{background:none;border:0;color:var(--muted);font-size:10.5px;display:flex;
  flex-direction:column;align-items:center;gap:5px;cursor:pointer;padding:4px 2px;}
nav button.on{color:var(--accent);}
nav .ni{width:44px;height:30px;border-radius:12px;display:grid;place-items:center;transition:background .18s;}
nav button.on .ni{background:var(--accent);}
nav button.on .ni svg{stroke:var(--on);}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}

.alert{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);}
.alert:last-child{border-bottom:0;}
.alert .g{flex:1;min-width:0;}
.alert .t{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.alert .s{font-size:11px;color:var(--muted);margin-top:4px;}
.inline{padding:0 16px 16px;border-bottom:1px solid var(--line);}
.tag{font-size:10.5px;padding:3px 8px;border-radius:8px;background:var(--surf2);color:var(--muted);}
.catchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surf);
  border-radius:12px;padding:8px 11px;font-size:12.5px;margin:0 0 8px 8px;}
.catchip b{width:8px;height:8px;border-radius:99px;display:inline-block;}
.catchip button{background:none;border:0;color:var(--clay);font-size:15px;line-height:1;cursor:pointer;padding:0 2px;}
.bookseg{display:flex;gap:4px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:4px;margin:0 18px 4px;}
.bookseg button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:12.5px;padding:9px 4px;border-radius:11px;cursor:pointer;}
.bookseg button.on{background:var(--accent);color:var(--on);font-weight:600;}
.rep{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:16px;}
.rep h4{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:500;}
.rep .l{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line);}
.rep .l:last-child{border-bottom:0;}
.rep .l small{color:var(--muted);font-size:11px;}
.rep .tot{display:flex;justify-content:space-between;font-weight:600;font-size:14px;padding-top:10px;margin-top:6px;border-top:1px solid var(--line);}
body.office{--accent:#6FD3B5;--on:#0B241D;}
body.office .bookseg{border-color:#2E5147;}
#printarea{display:none;}
#toast{position:fixed;inset-inline:0;bottom:calc(90px + (env(safe-area-inset-bottom) * 0.3));z-index:60;
  display:flex;justify-content:center;pointer-events:none;opacity:0;transition:opacity .2s;}
#toast.on{opacity:1;}
#toast span{background:var(--accent);color:var(--on);font-size:13px;font-weight:600;
  padding:10px 18px;border-radius:99px;box-shadow:0 10px 26px rgba(0,0,0,.5);}
@media print{
  #app,nav{display:none!important;}
  html,body{background:#fff!important;}
  #printarea{display:block!important;background:#fff;color:#111;padding:0 6mm;font-family:'IBM Plex Sans Arabic',sans-serif;}
  #printarea h1{font-size:19px;margin:0 0 2px;}
  #printarea .sub{font-size:11px;color:#555;margin-bottom:14px;}
  #printarea h2{font-size:14px;margin:16px 0 6px;border-bottom:1px solid #000;padding-bottom:4px;}
  #printarea .l{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:5px 0;border-bottom:1px dotted #bbb;}
  #printarea .l small{color:#666;font-size:10px;}
  #printarea .tot{display:flex;justify-content:space-between;font-weight:700;font-size:13px;padding-top:7px;margin-top:4px;border-top:1.5px solid #000;}
  #printarea .final{margin-top:18px;padding:10px;border:1.5px solid #000;font-size:14px;font-weight:700;display:flex;justify-content:space-between;}
  #printarea .foot{margin-top:20px;font-size:10px;color:#666;}
}
</style>
</head>

  <button data-tab="scan" onclick="app.go('scan')"><span class="ni">
    <svg viewBox="0 0 24 24"><path d="M6 3.5h12v15.8l-2 -1.3-2 1.3-2-1.3-2 1.3-2-1.3-2 1.3z"/><path d="M9 8h6M9 11.5h6"/></svg></span>فاتورة</button>

<script>
/* ==========================================================================

const SKEY='masareef:v3', AKEY='masareef:apikey', BKEY='masareef:book';

const ghGetGistId=()=>{try{return localStorage.getItem(GIDKEY)||'';}catch(e){return '';}};

const DEF_CATS=[

 {id:'devices',label:'أجهزة وأثاث',color:'#7FD1E8'},
 {id:'repair',label:'صيانة وإصلاح',color:'#D9A0F0'},
 {id:'installment',label:'قسط',color:'#5C86C4'},
 {id:'other',label:'حاجات تانية',color:'#8D96A2'}
];
const LOCKED=['subs','installment','other'];
const NEWCOLORS=['#7FD1E8','#F0A6C0','#A5D96F','#D9A0F0','#F2C14E','#6FD3B0','#F08A6E','#9BA8F5'];

 {id:'bank',name:'حساب CIB',opening:0},
 {id:'card',name:'كارت المشتريات',opening:0},
 {id:'vcash',name:'فودافون كاش',opening:0},
 {id:'cash',name:'كاش',opening:0}
],txns:[]};

const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

/* ==========================================================================
   2) أدوات عامة
   ========================================================================== */
const AR='٠١٢٣٤٥٦٧٨٩', FA='۰۱۲۳۴۵۶۷۸۹';
const toEn=s=>String(s==null?'':s).replace(/[٠-٩۰-۹]/g,c=>{const i=AR.indexOf(c);return String(i>-1?i:FA.indexOf(c));});
const onlyDigits=s=>toEn(s).replace(/\D/g,'');
const onlyNum=s=>{let v=toEn(s).replace(/[^0-9.]/g,'');
  const i=v.indexOf('.');
  if(i>-1)v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,'');

   ========================================================================== */
async function ghApi(path,opts){
  opts=opts||{};
  const headers={'Authorization':'token '+ghToken,'Content-Type':'application/json'};
  const r=await fetch('https://api.github.com'+path,{method:opts.method||'GET',headers:headers,
    body:opts.body?JSON.stringify(opts.body):undefined});
  if(!r.ok){const err=new Error('gh:'+r.status);err.status=r.status;throw err;}
  return r.json();
}
async function ghFindGist(){
  for(let page=1;page<=3;page++){
    const list=await ghApi('/gists?per_page=100&page='+page);
    const hit=list.find(g=>g.description===GIST_DESC);
    if(hit)return hit.id;
    if(list.length<100)break;
  }
  return null;
}
async function ghCreateGist(){
  const g=await ghApi('/gists',{method:'POST',body:{description:GIST_DESC,public:false,
    files:{[GIST_FILE]:{content:JSON.stringify(D)}}}});
  return g.id;
}
async function ghGetRemote(id){
  const g=await ghApi('/gists/'+id);
  const f=g.files&&g.files[GIST_FILE];
  if(!f||!f.content)return null;
  try{return JSON.parse(f.content);}catch(e){return null;}
}
async function ghPatch(id,dataStr){
  await ghApi('/gists/'+id,{method:'PATCH',body:{files:{[GIST_FILE]:{content:dataStr}}}});
}
function ghErrMsg(err){
  if(err&&err.status===401)return 'المفتاح غلط أو مالوش صلاحية gist. راجعه من github.com/settings/tokens.';
  if(err&&err.status===403)return 'حصل تجاوز لحد الطلبات، جرب تاني بعد شوية.';
  if(err&&err.status)return 'حصل خطأ من GitHub (كود '+err.status+').';
  return 'مقدرتش أوصل لـ GitHub. اتأكد إن عندك إنترنت.';
}
let ghLastPull=0;
function ghMaybePull(){
  if(!ghToken||!ghGist)return;
  const now=Date.now();
  if(now-ghLastPull<60000)return;
  ghLastPull=now;
  ghReconcile();
}
function scheduleGhPush(){
  if(!ghToken||!ghGist)return;
  clearTimeout(ghPushTimer);
  ghPushTimer=setTimeout(()=>{ghPatch(ghGist,JSON.stringify(D)).then(()=>{
    D.ghLastSync=new Date().toISOString();
    try{localStorage.setItem(SKEY,JSON.stringify(D));}catch(e){}
    if(tab==='settings')render();
  }).catch(()=>{});},2500);
}
async function ghReconcile(){
  if(!ghToken||!ghGist)return;
  ghState.busy=true;render();
  try{
    const remote=await ghGetRemote(ghGist);
    const localSv=D._sv||0, remoteSv=(remote&&remote._sv)||0;
    if(remote&&remoteSv>localSv){
      D=remote;normalizeData();
      D.ghLastSync=new Date().toISOString();
      try{localStorage.setItem(SKEY,JSON.stringify(D));}catch(e){}
      app.toast('اتزامنت البيانات من جهاز تاني');
    }else{
      await ghPatch(ghGist,JSON.stringify(D));
      D.ghLastSync=new Date().toISOString();
      try{localStorage.setItem(SKEY,JSON.stringify(D));}catch(e){}
    }
    ghState.msg='';
  }catch(err){ghState.msg=ghErrMsg(err);}
  ghState.busy=false;render();
}
async function ghConnect(){
  const el=document.getElementById('ghtokin');
  const tok=el?el.value.trim():'';
  if(!tok){ghState.msg='محتاج تلصق المفتاح الأول.';render();return;}
  ghState.busy=true;ghState.msg='';render();
  try{
    ghToken=tok;
    let id=await ghFindGist();
    if(!id)id=await ghCreateGist();
    ghGist=id;
    try{localStorage.setItem(GKEY,ghToken);localStorage.setItem(GIDKEY,ghGist);}catch(e){}
    ghState.busy=false;render();
    await ghReconcile();
  }catch(err){
    ghToken='';ghGist='';
    try{localStorage.removeItem(GKEY);localStorage.removeItem(GIDKEY);}catch(e){}
    ghState.busy=false;ghState.msg=ghErrMsg(err);render();
  }
}

  '- خليك ثابت: نفس المنتج ياخد نفس الاسم كل مرة.\n'+
  '- لو فيه خصم حطه كصنف اسمه "خصم" بمبلغ بالسالب وتصنيف other.\n'+
  '- لو فيه ضريبة أو خدمة حطها صنف مستقل بتصنيف other.\n'+
  '- الأرقام صافية من غير عملة ولا فواصل آلاف.\n'+
  '- لو صنف مش واضح، خمّن أقرب تصنيف منطقي.\n\n'+
  'رجّع JSON بس من غير أي كلام تاني ومن غير علامات كود:\n'+

async function shrink(file){
  const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(0);r.readAsDataURL(file);});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(0);i.src=url;});
  const s=Math.min(1,1400/Math.max(img.width,img.height));
  const c=document.createElement('canvas');
  c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.85).split(',')[1];
}
async function readReceipt(b64){
  const key=getKey();
  const headers={'content-type':'application/json'};
  if(key){headers['x-api-key']=key;headers['anthropic-version']='2023-06-01';
          headers['anthropic-dangerous-direct-browser-access']='true';}
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers,body:JSON.stringify({
    model:key?'claude-sonnet-5':'claude-sonnet-4-6', max_tokens:key?2000:1000,
    messages:[{role:'user',content:[
      {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
      {type:'text',text:promptText()}]}]})});
  const data=await r.json();
  if(data.error)throw new Error(data.error.message||'api');
  const text=(data.content||[]).filter(i=>i.type==='text').map(i=>i.text).join('\n');
  const clean=text.replace(/```json|```/g,'').trim();
  return JSON.parse(clean.slice(clean.indexOf('{'),clean.lastIndexOf('}')+1));
}

function itemNames(){
  const seen=[],out=[];
  D.txns.filter(t=>t.book==='office'&&t.kind==='expense'&&t.item).forEach(t=>{
    const n=normItem(t.item);
    if(n&&seen.indexOf(n)<0){seen.push(n);out.push(n);}});
  return out.slice(0,8);
}
function itemSuggestions(fn){
  const n=itemNames();
  if(!n.length)return '';
  return `<div class="chips" style="margin-top:9px">${n.map(x=>`<button class="chip sm" onclick="${fn}('${esc(x).replace(/'/g,"&#39;")}')">${esc(x)}</button>`).join('')}</div>`;
}

function vchPicker(selId,total,fnPick){
  const live=(D.vouchers||[]).filter(vchLive);
  if(!live.length)return '';
  const usable=live.filter(x=>Number(x.amount)<=total);
  if(!usable.length)return `<div class="hint" style="margin-top:18px">عندك <span class="n">${live.length}</span> فاوتشر، بس قيمة أصغر واحد فيهم
    (<span class="n">${fmt(Math.min.apply(null,live.map(x=>Number(x.amount))))}</span>) أكبر من الفاتورة، فمينفعش يتستخدم دلوقتي.</div>`;
  const v=usable.find(x=>x.id===selId);
  return `<label class="f">فاوتشر (اختياري)</label>
    <div class="chips">${usable.map(x=>`<button class="chip sm${selId===x.id?' on':''}" onclick="${fnPick}('${x.id}')"><span class="n">${esc(x.code)}</span> · <span class="n">${fmt(x.amount)}</span></button>`).join('')}
      ${selId?`<button class="chip sm" onclick="${fnPick}('')">شيله</button>`:''}</div>
    ${v?`<div class="hint">هيتخصم من حسابك <span class="n">${fmt(Math.max(0,total-Number(v.amount)))}</span> جنيه بس.</div>`:''}`;
}

function render(){
  if(document.body&&document.body.classList)document.body.classList.toggle('office',book==='office');
  document.querySelectorAll('.bookseg button').forEach(x=>x.classList.remove('on'));
  const bb=document.getElementById(book==='me'?'bk-me':'bk-office');
  if(bb)bb.classList.add('on');
  const lb=document.querySelector('header .lbl');
  if(lb)lb.textContent=book==='me'?'إجمالي اللي معاك':'رصيد عهدة المكتب';
  const b=balances(book);
  const own=accountsFor(book).filter(a=>!a.credit);
  const vals=own.map(a=>Math.max(0,b[a.id]||0));
  const sum=vals.reduce((x,y)=>x+y,0);
  document.getElementById('total').textContent=fmt(own.reduce((x,a)=>x+(b[a.id]||0),0));
  document.getElementById('split').innerHTML= sum>0
    ? own.map((a,i)=>vals[i]>0?`<div style="width:${vals[i]/sum*100}%;background:${aColor(a.id)}"></div>`:'').join('')
    : '';
  const cr=book==='me'?accountsFor('me').filter(a=>a.credit):[];
  const cn=document.getElementById('creditnote');
  if(cn)cn.innerHTML=cr.length?('رصيد ائتماني متاح: <span class="n">'+fmt(cr.reduce((x,a)=>x+(b[a.id]||0),0))+'</span>'):'';
  const views={home:vHome,add:vAdd,scan:vScan,wallet:vWallet,log:vLog,settings:vSettings};
  document.getElementById('view').innerHTML=views[tab]();
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab===tab));
}

function useVoucher(id,total,date){
  if(!id)return null;
  const v=(D.vouchers||[]).find(x=>x.id===id);
  if(!v||v.used)return null;
  const used=Math.min(Number(v.amount)||0,total);
  if(used<=0)return null;
  v.used=true;v.usedOn=date||today();
  return {id:v.id,amount:Math.round(used*100)/100,code:v.code};
}
function refundVoucher(t){
  if(!t||!t.voucher)return;
  const v=(D.vouchers||[]).find(x=>x.id===t.voucher.id);
  if(v){v.used=false;v.usedOn='';}
}

const app={
  setBook(bk){book=bk;try{localStorage.setItem(BKEY,bk);}catch(e){}fMonth='';fCat='';fAcct='';eTxn=null;tab='home';wtab=bk==='office'?'accounts':'accounts';confirmKey='';q='';render();window.scrollTo(0,0);},
  goClose(){tab='wallet';wtab='close';closeTo=today();render();window.scrollTo(0,0);},
  oSet(k,v){draftO[k]=v;setDisabled('osave',oOk());},
  oKind(k){draftO.kind=k;render();},
  oAccount(id){draftO.account=id;render();},
  oCat(id){draftO.ocat=id;render();},
  oDir(d){draftO.dir=d;render();},
  oItemPick(v){draftO.item=v;render();},
  oDate(v){draftO.date=v;render();},
  oTo(id){draftO.to=id;render();},
  oSave(){
    const amt=Number(onlyNum(draftO.amount))||0;
    if(amt<=0)return;
    if(draftO.kind!=='loan'&&!draftO.account)return;
    const it=normItem(draftO.item);
    if(draftO.kind==='loan'){
      if(!D.floatLoans)D.floatLoans=[];
      D.floatLoans.push({id:uid(),dir:draftO.dir==='back'?'back':'take',amount:amt,
        date:draftO.date,note:draftO.note.trim()});
      save();
      draftO={kind:'expense',amount:'',account:'',to:'',item:'',ocat:'',date:today(),note:'',dir:'take'};
      render();window.scrollTo(0,0);app.toast('اتسجلت');return;
    }
    if(draftO.kind==='float'){
      D.txns.unshift({id:uid(),book:'office',kind:'float',amount:amt,account:draftO.account,
        date:draftO.date,note:draftO.note.trim()});
    }else if(draftO.kind==='bonus'){
      const link=uid();
      D.txns.unshift({id:uid(),link:link,book:'office',kind:'expense',amount:amt,account:draftO.account,
        date:draftO.date,item:it,ocat:draftO.ocat,note:it});
      D.txns.unshift({id:uid(),link:link,book:'me',kind:'income',amount:amt,account:draftO.to,
        date:draftO.date,note:it,fromOffice:true});
    }else{
      D.txns.unshift({id:uid(),book:'office',kind:'expense',amount:amt,account:draftO.account,
        date:draftO.date,item:it,ocat:draftO.ocat,note:it});
    }
    sortTxns();save();
    draftO={kind:'expense',amount:'',account:'',to:'',item:'',ocat:'',date:today(),note:'',dir:'take'};
    render();window.scrollTo(0,0);app.toast('اتحفظت');
  },
  setCloseTo(v){closeTo=v;render();},
  setCloseMode(m){closeMode=m;render();},
  setCloseAcct(id){closeAcct=id;render();},
  closePeriod(){
    const from=periodFrom();
    const r=officeReport(from,closeTo);
    const settleIds=[];
    if(closeMode==='settle'){
      const ob=balances('office');
      accountsFor('office').forEach(a=>{
        const v=Math.round((ob[a.id]||0)*100)/100;
        if(Math.abs(v)<0.01)return;
        const sid=uid();settleIds.push(sid);
        D.txns.unshift({id:sid,book:'office',kind:'settle',dir:v<0?'in':'out',
          amount:Math.abs(v),account:a.id,date:closeTo,note:'تسوية تقفيل'});
      });
      sortTxns();

    if(draft.kind==='expense'&&draft.account==='vcash'&&draft.vc==='withdraw'){
      if(amt<=0)return;
      const dest=draft.to2||'cash';
      D.txns.unshift({id:uid(),book:'me',kind:'transfer',amount:amt,account:'vcash',to:dest,
        date:draft.date,note:'سحب من مكنة فودافون كاش'});
      const fee=Number(onlyNum(draft.fee))||0;
      if(fee>0)D.txns.unshift({id:uid(),book:'me',kind:'expense',amount:fee,cat:'fees',
        account:'vcash',date:draft.date,note:'عمولة سحب فودافون كاش'});
      sortTxns();save();
      draft={kind:'expense',amount:'',cat:'',account:'',to:'',note:'',date:today(),cur:'EGP',voucherId:'',voucherAmt:'',salary:true,owed:false,owedPeople:[{name:'',amount:''}],fromFloat:false,floatAmt:'',vc:'pay',fee:'',to2:'cash'};
      render();window.scrollTo(0,0);app.toast('اتسجل السحب');return;
    }
    const usd=draft.cur==='USD'?amt:0;
    let fromFloat=(draft.kind==='expense'&&draft.fromFloat&&!usd)?(Number(onlyNum(draft.floatAmt))||0):0;

    const vch=useVoucher(draft.kind==='expense'&&!usd?draft.voucherId:'',gross,draft.date);
    D.txns.unshift({id:uid(),book:'me',kind:draft.kind,amount:Math.round((gross-(vch?vch.amount:0))*100)/100,

      note:draft.note,date:draft.date,usd:usd||undefined,rate:usd?D.rate:undefined,
      pending:usd?true:undefined,voucher:vch||undefined,
      salary:(draft.kind==='income'&&draft.salary)?true:undefined});

        note:draft.note||catOf(draft.cat).label});

          note:draft.note||catOf(draft.cat).label,got:false});

  },
  ungive(id){
    const v=D.vouchers.find(x=>x.id===id);if(!v)return;
    v.given=false;v.givenTo='';save();render();
  },
  async shareVch(id){
    const v=D.vouchers.find(x=>x.id===id);if(!v)return;
    const txt='فاوتشر CIB\n'+
      'رقم الفاوتشر: '+v.code+'\n'+
      'آخر ٦ أرقام من البطاقة: '+v.card+'\n'+
      'رقم الموبايل: '+D.phone+'\n'+
      'القيمة: '+fmt(v.amount)+' جنيه\n'+
      'ينتهي في: '+dayLabel(v.expiry);
    try{
      if(navigator.share){await navigator.share({text:txt});}
      else{await navigator.clipboard.writeText(txt);copied='s'+id;render();
           setTimeout(()=>{copied='';render();},1500);}
    }catch(e){}
  },
  copy(txt,tag){
    try{navigator.clipboard.writeText(txt);}catch(e){}
    copied=tag;render();
    setTimeout(()=>{copied='';render();},1500);
  },
  delVch(id){
    D.vouchers=D.vouchers.filter(v=>v.id!==id);confirmKey='';save();render();
  },
  setVch(id){draft.voucherId=id;render();},
  scanVch(id){scan.voucherId=id;render();},

  /* --- اشتراكات --- */
  goSubs(){tab='wallet';wtab='subs';render();window.scrollTo(0,0);},
  toggleSub(){showSub=!showSub;render();},
  subSet(k,v){subDraft[k]=v;setDisabled('subsave',subOk());},
  personSet(i,k,v){if(subDraft.people[i])subDraft.people[i][k]=v;},
  personAdd(){subDraft.people.push({name:'',amount:''});render();},
  personDel(i){subDraft.people.splice(i,1);if(!subDraft.people.length)subDraft.people.push({name:'',amount:''});render();},
  subPick(k,v){subDraft[k]=v;render();},
  subAccount(id){subDraft.account=id;if(id!=='card')subDraft.cur='EGP';render();},
  addSub(){
    D.subs.push({id:uid(),name:subDraft.name.trim(),
      amount:(subDraft.cycle==='trial'&&!subDraft.willRenew)?0:Number(onlyNum(subDraft.amount))||0,
      cur:subDraft.cur,cycle:subDraft.cycle,next:subDraft.next,
      account:'card',cat:'subs',cancelAtEnd:false,payments:[],dues:[],
      people:(subDraft.cycle!=='trial'&&subDraft.split)
        ?subDraft.people.filter(p=>Number(onlyNum(p.amount))>0).map(p=>({name:p.name.trim()||'حد',amount:Number(onlyNum(p.amount))}))
        :[],
      myShare:null,
      willRenew:subDraft.cycle==='trial'?!!subDraft.willRenew:undefined,
      afterCycle:subDraft.cycle==='trial'?subDraft.afterCycle:undefined});
    subDraft={name:'',amount:'',cur:'EGP',cycle:'monthly',next:today(),account:'',cat:'subs',willRenew:true,afterCycle:'monthly',split:false,people:[{name:'',amount:''}]};
    showSub=false;save();render();
  },
  paySub(id){
    const s=D.subs.find(x=>x.id===id);if(!s||s.cycle==='trial')return;
    paySubFor=id;paySubDate=s.next<=today()?s.next:today();
    tab='wallet';wtab='subs';render();
    setTimeout(()=>{const el=document.getElementById('sub-'+id);if(el)el.scrollIntoView({block:'center'});},60);
  },
  startSubEdit(id){
    if(editSub===id){editSub=null;render();return;}
    const s=D.subs.find(x=>x.id===id);if(!s)return;
    const ppl=(s.people&&s.people.length)?s.people.map(p=>({name:p.name,amount:String(p.amount)})):[{name:'',amount:''}];
    sDraft={name:s.name,amount:String(s.amount||''),cur:s.cur||'EGP',cycle:s.cycle==='yearly'?'yearly':'monthly',
      next:s.next,split:!!(s.people&&s.people.length),people:ppl};
    editSub=id;paySubFor=null;render();
  },
  cancelSubEdit(){editSub=null;render();},
  sdSet(k,v){sDraft[k]=v;},
  sdPick(k,v){sDraft[k]=v;render();},
  sdPerson(i,k,v){if(sDraft.people[i])sDraft.people[i][k]=v;},
  sdPersonAdd(){sDraft.people.push({name:'',amount:''});render();},
  sdPersonDel(i){sDraft.people.splice(i,1);if(!sDraft.people.length)sDraft.people.push({name:'',amount:''});render();},
  saveSubEdit(id){
    const s=D.subs.find(x=>x.id===id);if(!s)return;
    const nm=String(sDraft.name||'').trim();
    if(nm)s.name=nm;
    const amt=Number(onlyNum(sDraft.amount))||0;
    if(amt>0)s.amount=amt;
    s.cur=sDraft.cur;s.cycle=sDraft.cycle;s.next=sDraft.next||s.next;
    s.people=sDraft.split
      ?sDraft.people.filter(p=>Number(onlyNum(p.amount))>0).map(p=>({name:String(p.name||'').trim()||'حد',amount:Number(onlyNum(p.amount))}))
      :[];
    s.myShare=null;
    editSub=null;save();render();app.toast('اتعدل');
  },
  startFee(id){feeFor=feeFor===id?null:id;render();},
  cancelFee(){feeFor=null;render();},
  saveFee(id){
    const s=D.subs.find(x=>x.id===id);if(!s)return;
    const v=numVal('feein');
    if(v<=0){feeFor=null;render();return;}
    const p=subLastPay(s);if(!p){feeFor=null;render();return;}
    const t={id:uid(),book:'me',kind:'expense',amount:v,cat:'fees',account:s.account||'card',
      date:today(),note:'تدبير عملة — '+s.name};
    D.txns.unshift(t);
    p.fee=v;p.feeTxn=t.id;s.feeEst=v;
    feeFor=null;sortTxns();save();render();app.toast('اتسجلت');
  },
  setPaySubDate(v){paySubDate=v;render();},
  cancelPaySub(){paySubFor=null;render();},
  confirmPaySub(id){
    const s=D.subs.find(x=>x.id===id);if(!s||s.cycle==='trial'){paySubFor=null;render();return;}
    const usd=s.cur==='USD'?Number(s.amount):0;
    const full=usd?Math.round(usd*D.rate*100)/100:Number(s.amount);
    const t={id:uid(),book:'me',kind:'expense',amount:full,
      cat:s.cat||'subs',account:s.account||'card',date:paySubDate,note:s.name,
      usd:usd||undefined,rate:usd?D.rate:undefined,pending:usd?true:undefined};
    D.txns.unshift(t);
    if(!s.payments)s.payments=[];
    s.payments.push({d:paySubDate,t:t.id,paid:full});
    if(subShared(s)){
      if(!s.dues)s.dues=[];
      const ppl=subPeople(s);
      if(ppl.length){
        ppl.forEach(p=>{
          const amt=usd?Math.round(Number(p.amount)*D.rate*100)/100:Number(p.amount);
          if(amt>0.01)s.dues.push({id:uid(),who:p.name,amount:amt,date:paySubDate,got:false});
        });
      }else{
        const mineEgp=usd?Math.round(subMine(s)*D.rate*100)/100:subMine(s);
        const owed=Math.round((full-mineEgp)*100)/100;
        if(owed>0.01)s.dues.push({id:uid(),amount:owed,date:paySubDate,got:false});
      }
    }
    s.next=dAdd(s.next,s.cycle==='yearly'?12:1);
    paySubFor=null;sortTxns();save();render();app.toast('اتسجلت');
  },
  startDue(id){dueFor=id;dueAcct='';render();},
  cancelDue(){dueFor=null;render();},
  setDueAcct(id){dueAcct=id;render();},
  confirmDue(subId,dueId){
    const s=D.subs.find(x=>x.id===subId);if(!s)return;
    const d=(s.dues||[]).find(x=>x.id===dueId);if(!d||!dueAcct)return;
    const t={id:uid(),book:'me',kind:'income',amount:d.amount,account:dueAcct,
      date:today(),note:(d.who?'حصة '+d.who:'حصة الناس')+' في '+s.name};
    D.txns.unshift(t);
    d.got=true;d.gotOn=today();d.txn=t.id;
    dueFor=null;dueAcct='';sortTxns();save();render();app.toast('اتسجلت');
  },
  dropDue(subId,dueId){
    const s=D.subs.find(x=>x.id===subId);if(!s)return;
    s.dues=(s.dues||[]).filter(x=>x.id!==dueId);
    dueFor=null;save();render();
  },
  cancelEnd(id){const s=D.subs.find(x=>x.id===id);if(!s)return;s.cancelAtEnd=true;save();render();},
  resume(id){const s=D.subs.find(x=>x.id===id);if(!s)return;s.cancelAtEnd=false;
    let g=0;while(daysTo(s.next)<0&&g++<120)s.next=dAdd(s.next,s.cycle==='yearly'?12:1);
    save();render();},
  skipSub(id){
    const s=D.subs.find(x=>x.id===id);if(!s)return;
    s.next=dAdd(s.next,s.cycle==='yearly'?12:1);save();render();
  },
  startConv(id){
    if(convFor===id){convFor=null;render();return;}
    const s=D.subs.find(x=>x.id===id);if(!s)return;
    convFor=id;
    subDraft.cur=s.cur||'EGP';subDraft.amount=s.amount?String(s.amount):'';
    subDraft.willRenew=s.willRenew!==false;subDraft.afterCycle=s.afterCycle||'monthly';subDraft.next=s.next;
    render();
  },
  savePlan(id){
    const s=D.subs.find(x=>x.id===id);if(!s)return;
    s.willRenew=!!subDraft.willRenew;
    s.next=subDraft.next||s.next;
    if(s.willRenew){s.amount=Number(onlyNum(subDraft.amount))||0;s.cur=subDraft.cur;s.afterCycle=subDraft.afterCycle;}
    convFor=null;save();render();
  },
  convertNow(id){
    const s=D.subs.find(x=>x.id===id);if(!s)return;
    s.cycle=s.afterCycle||'monthly';s.account='card';s.cat='subs';s.cancelAtEnd=false;
    s.willRenew=undefined;s.afterCycle=undefined;
    convFor=null;save();render();
  },
  cancelConv(){convFor=null;render();},
  confirmConv(id){
    const s=D.subs.find(x=>x.id===id);if(!s)return;
    s.amount=numVal('convamt');
    s.cur=subDraft.cur;s.cycle=subDraft.cycle;s.account='card';s.cat='subs';s.cancelAtEnd=false;
    convFor=null;save();render();
  },
  delSub(id){
    D.subs=D.subs.filter(s=>s.id!==id);convFor=null;confirmKey='';save();render();
  },

  /* --- أقساط --- */
  toggleIns(){showIns=!showIns;payFor=null;render();},
  insSet(k,v){insDraft[k]=v;setDisabled('inssave',insOk());},
  insAccount(id){insDraft.account=id;render();},
  insSrc(v){insDraft.src=v;render();},
  addIns(){
    D.installments.push({id:uid(),name:insDraft.name.trim(),monthly:Number(onlyNum(insDraft.monthly))||0,
      months:Number(onlyNum(insDraft.months))||0,paid:Number(onlyNum(insDraft.paid))||0,
      day:Math.min(Math.max(Number(onlyNum(insDraft.day))||1,1),28),account:insDraft.account,
      covered:mAdd(monthOf(today()),-1),firstMonth:monthOf(today()),tail:0,payments:[],
      src:insDraft.src||'office'});
    insDraft={name:'',monthly:'',months:'',paid:'0',day:'1',account:'',src:''};showIns=false;save();render();
  },
  startPay(id,mode){payFor=id;payMode=mode||'front';editAmt=false;payDate=today();tab='wallet';wtab='ins';render();
    setTimeout(()=>{const el=document.getElementById('pay-'+id);if(el)el.scrollIntoView({block:'center'});},60);},
  setPayDate(v){payDate=v;render();},
  cancelPay(){payFor=null;editAmt=false;render();},
  toggleEditAmt(){editAmt=!editAmt;render();},
  confirmPay(id){
    const i=D.installments.find(x=>x.id===id);
    if(!i||insDone(i)){payFor=null;render();return;}
    const forMonth=insNextMonth(i);
    const ahead=forMonth>curPeriodMonth();
    const amt=(i.src==='office'&&editAmt&&document.getElementById('insamt'))?(numVal('insamt')||Number(i.monthly)):Number(i.monthly);
    const t={id:uid(),book:'me',kind:'expense',amount:amt,cat:'installment',account:i.account,
      date:payDate,note:i.name+' — قسط '+mLabel(forMonth)+(ahead?' (مقدم)':'')};
    D.txns.unshift(t);sortTxns();
    i.paid=(Number(i.paid)||0)+1;
    i.covered=forMonth;
    if(!i.payments)i.payments=[];
    i.payments.push({d:payDate,m:forMonth,t:t.id,amount:amt,type:'front'});
    payFor=null;payMode='front';editAmt=false;payDate=today();save();render();app.toast('اتسجل');
  },
  postponeIns(id){
    const i=D.installments.find(x=>x.id===id);if(!i||insDone(i))return;
    i.covered=insNextMonth(i);
    i.months=(Number(i.months)||0)+1;
    save();render();app.toast('اتأجل شهر');
  },
  undoIns(id){
    const i=D.installments.find(x=>x.id===id);if(!i||!i.payments||!i.payments.length)return;
    const last=i.payments.pop();
    D.txns=D.txns.filter(t=>t.id!==last.t);
    i.paid=Math.max(0,(Number(i.paid)||0)-1);
    i.covered=mAdd(last.m,-1);
    save();render();
  },
  delIns(id){
    D.installments=D.installments.filter(x=>x.id!==id);payFor=null;confirmKey='';save();render();
  },

  /* --- شهادات --- */
  toggleCert(){showCert=!showCert;render();},
  certSet(k,v){certDraft[k]=v;
    if(k==='start'||k==='end'){render();return;}
    setDisabled('certsave',certOk());
    const el=document.getElementById('certmo');
    if(el)el.textContent=fmt(certMonthly(certDraft.amount,certDraft.rate));},
  certAccount(id){certDraft.account=id;render();},
  addCert(){
    D.certs.push(mkCert('شهادة '+((D.certs||[]).length+1),certDraft.amount,certDraft.rate,certDraft.start,certDraft.account,certDraft.end));
    certDraft={amount:'10000',rate:'19.5',start:today(),end:'',account:'bank'};showCert=false;
    const cu=catchUp();save();
    autoMsg=cu.n?('اتقيد '+cu.n+' فايدة بإجمالي '+fmt(cu.tot)+' جنيه.'):'';
    render();
  },
  delCert(id){
    const linked=certAccounts(id);
    if(linked.length){
      confirmKey='';
      alert('الشهادة دي ضمان لـ'+linked.map(a=>a.name).join(' و')+'. شيلها من الضمان الأول من الإعدادات.');
      render();return;
    }
    D.certs=D.certs.filter(c=>c.id!==id);confirmKey='';save();render();
  },

  /* --- تصنيفات --- */
  addCat(){
    const el=document.getElementById('newcat'),n=el.value.trim();
    if(!n)return;
    D.cats.push({id:uid(),label:n,color:NEWCOLORS[D.cats.length%NEWCOLORS.length]});
    save();render();
  },
  delCat(id){
    if(LOCKED.indexOf(id)>-1)return;
    D.txns.forEach(t=>{if(t.cat===id)t.cat='other';(t.items||[]).forEach(i=>{if(i.cat===id)i.cat='other';});});
    D.subs.forEach(s=>{if(s.cat===id)s.cat='subs';});
    D.cats=D.cats.filter(c=>c.id!==id);confirmKey='';save();render();
  },

  /* --- إعدادات --- */
  accCfgSet(id,k,v){if(!accCfg)accCfgInit();accCfg[id][k]=v;},
  accCfgCredit(id,c){if(!accCfg)accCfgInit();accCfg[id].credit=c;render();},
  setScope(id,s){const a=D.accounts.find(x=>x.id===id);if(a){a.scope=s;save();render();}},
  toggleSecured(accId,certId){
    const a=D.accounts.find(x=>x.id===accId);if(!a)return;
    if(certHeldBy(certId,accId))return;
    if(!a.secured)a.secured=[];
    const i=a.secured.indexOf(certId);
    if(i>-1)a.secured.splice(i,1);else a.secured.push(certId);
    save();render();
  },
  saveAccounts(){
    if(!accCfg)accCfgInit();
    D.accounts.forEach(a=>{const c=accCfg[a.id];if(!c)return;
      const nm=String(c.name||'').trim();
      if(nm)a.name=nm;
      a.credit=!!c.credit;
      a.limit=c.credit?(Number(onlyNum(c.limit))||0):0;});
    accCfgInit();save();msg='اتحفظ.';render();
  },
  saveRate(){
    const v=numVal('ratein');
    if(v>0){D.rate=v;save();msg='اتحفظ.';}
    render();
  },
  toggleGhHelp(){showGhHelp=!showGhHelp;render();},
  ghConnect(){return ghConnect();},
  ghSyncNow(){return ghReconcile();},
  ghDisconnect(){
    ghToken='';ghGist='';
    try{localStorage.removeItem(GKEY);localStorage.removeItem(GIDKEY);}catch(e){}
    confirmKey='';ghState={busy:false,msg:''};render();
  },
  editKey(){showKeyEdit=true;confirmKey='';render();},
  cancelKeyEdit(){showKeyEdit=false;render();},
  clearKey(){
    try{localStorage.removeItem(AKEY);}catch(e){}
    confirmKey='';showKeyEdit=false;render();
  },
  saveKey(){
    const el=document.getElementById('keyin');
    const v=el?el.value.trim():'';
    if(!v){msg='';render();return;}
    try{localStorage.setItem(AKEY,v);msg='اتحفظ.';}
    catch(e){msg='مقدرتش أحفظ المفتاح.';}
    showKeyEdit=false;render();
  },
  async exportData(){
    const txt=JSON.stringify(D,null,2);
    const name='masareef-'+today()+'.json';
    D.lastBackup=today();save();
    try{
      const file=new File([txt],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:name});
        render();return;
      }
    }catch(e){}
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
    a.download=name;a.click();
    render();app.toast('اتحفظت نسخة');
  },
  importData(el){
    const f=el.files&&el.files[0];el.value='';if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);
      if(d.accounts&&d.txns){D=d;load();save();msg='البيانات رجعت.';render();}else alert('الملف مش سليم.');}
      catch(e){alert('الملف مش سليم.');}};
    r.readAsText(f);
  },
  wipe(){
    try{localStorage.removeItem(SKEY);}catch(e){}
    D=JSON.parse(JSON.stringify(DEFAULT));
    D.certs=[];D.subs=[];D.installments=[];D.vouchers=[];D.closings=[];
    D.cats=JSON.parse(JSON.stringify(DEF_CATS));D.lastClose='';D.lastBackup='';
    load();confirmKey='';save();tab='home';book='me';render();
  }
};

if(navigator.storage&&navigator.storage.persist){
  navigator.storage.persisted().then(p=>{if(!p)navigator.storage.persist().catch(()=>{});}).catch(()=>{});
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
load();
sortTxns();
if(D._needSort){delete D._needSort;save();}
if(ghToken&&ghGist){ghLastPull=Date.now();ghReconcile();}
if(document.addEventListener)document.addEventListener('visibilitychange',()=>{if(!document.hidden)ghMaybePull();});
(function(){
  const cu=catchUp();
  const parts=[];
  if(cu.n)parts.push('اتقيد '+cu.n+' دفعة فوايد بإجمالي '+fmt(cu.tot)+' جنيه على حسابك.');
  const tr=autoTrials();
  if(tr.length)parts.push('خلصت تجربة '+tr.join(' و')+' واتحولت لاشتراك زي ما ظبطت.');
  autoMsg=parts.join(' ');
})();
render();
</script>
</body>
</html>
